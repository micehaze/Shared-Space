   Boot, membership, subscriptions, shell, router
   ============================================================ */
const VIEWS = {};
const NAV = [
  ['inbox', 'Inbox', 'inbox'],
  ['gallery', 'Gallery', 'image'],
  ['locker', 'Locker', 'lock'],
  ['notepad', 'Notepad', 'note'],
  ['contacts', 'Contacts', 'contacts'],
  ['dates', 'Special dates', 'calendar'],
  ['kundlis', 'Our Charts', 'star'],
  ['account', 'Settings', 'sliders'],
];
const TAB_NAV = ['inbox', 'gallery', 'locker', 'dates'];

const root = () => document.getElementById('root');

function showLoading() {
  root().innerHTML = `<div class="loading"><span class="wordmark">Vice Space</span></div>`;
}

function gate(html) {
  root().innerHTML = `<div class="gate">${palm('l')}${palm('r')}${SKYLINE}<div class="card">${html}</div></div>`;
  const ps = $$('.gate .palm');
  if (ps[0]) Object.assign(ps[0].style, { left: '-40px', bottom: '8vh', height: '62vh' });
  if (ps[1]) Object.assign(ps[1].style, { right: '-50px', bottom: '4vh', height: '50vh', transform: 'scaleX(-1)' });
}

async function boot() {
  if (!document.querySelector('.scene')) document.body.insertAdjacentHTML('afterbegin', `<div class="scene" aria-hidden="true">${SCENE}</div>`);
  showLoading();
  const st = await Store.init();
  S.st = st;
  if (!st.ok && st.needAuth) { FirebaseStore.authGate(st.auth, () => boot()); return; }
  if (!st.ok) {
    gate(`<span class="wordmark">Vice Space</span>
      <p>Sign in to Claude to open your shared space. This page only opens for the two people it was shared with.</p>
      <button class="btn" onclick="location.reload()">Try again</button>`);
    return;
  }
  S.me.id = st.myId;
  let snap;
  try { snap = await retryOnce(() => st.db.doc('space/members').get()); } catch (e) {
    gate(`<span class="wordmark">Vice Space</span><p>${esc(errText(e))}</p><button class="btn" onclick="location.reload()">Try again</button>`);
    return;
  }
  const seats = (snap.exists && snap.data().seats) || {};
  const mine = ['A', 'B'].find((k) => seats[k] && seats[k].id === S.me.id);
  if (mine) return startApp(mine);
  const free = !seats.A ? 'A' : !seats.B ? 'B' : null;
  if (!free) {
    gate(`<span class="wordmark">Vice Space</span>
      <p>This space already belongs to two people, so it can’t take another member. If you think that’s wrong, ask the person who shared it with you.</p>`);
    return;
  }
  if (st.mode === 'local') {
    const seat = st.myId.endsWith('B') ? 'B' : 'A';
    if (window.OSS_STANDALONE && !seats.A && !seats.B) return phoneSetup();
    if (!seats[seat]) await claimSeat(seat === 'A' ? 'Person A' : 'Person B', seat);
    return startApp(seat);
  }
  const first = free === 'A';
  gate(`<span class="wordmark">${first ? 'Welcome home' : 'Come on in'}</span>
    <p>${first ? 'Set up your private space for two. After this, share the page with one other person so they can join.' : 'Someone saved a place for you here. Pick the name they’ll see on your messages.'}</p>
    <form id="joinForm">
      <label class="field"><span>Your name in this space</span><input name="nick" required maxlength="40" autocomplete="nickname" placeholder="e.g. Maya"></label>
      <button class="btn" type="submit">${first ? 'Create our space' : 'Join this space'}</button>
      <p class="hint" id="joinErr" role="alert"></p>
    </form>`);
  $('#joinForm').onsubmit = async (e) => {
    e.preventDefault();
    const nick = e.target.nick.value.trim();
    const btn = $('button', e.target); btn.disabled = true;
    try {
      const seat = await claimSeat(nick);
      if (!seat) { $('#joinErr').textContent = 'Both places in this space were just taken.'; return; }
      startApp(seat);
    } catch (err) { $('#joinErr').textContent = errText(err); btn.disabled = false; }
  };
}

/* Phone-only first run: both names, both seats on this device */

async function claimSeat(nick, forceSeat) {
  if (S.st.claimSeat) return S.st.claimSeat(nick);
  const ref = S.st.db.doc('space/members');
  for (let i = 0; i < 6; i++) {
    const lease = await ref.acquire({ holder: S.me.id, ttlMs: 4000 });
    if (!lease.acquired) { await new Promise((r) => setTimeout(r, 700)); continue; }
    const snap = await ref.get();
    const seats = (snap.exists && snap.data().seats) || {};
    const have = ['A', 'B'].find((k) => seats[k] && seats[k].id === S.me.id);
    if (have) return have;
    const seat = forceSeat && !seats[forceSeat] ? forceSeat : !seats.A ? 'A' : !seats.B ? 'B' : null;
    if (!seat) return null;
    const entry = { id: S.me.id, nick, joinedAt: Date.now() };
    if (snap.exists) await ref.update({ seats: { [seat]: entry } });
    else await ref.set({ seats: { [seat]: entry } });
    return seat;
  }
  throw { code: 'unavailable' };
}

/* ---------- subscriptions ---------- */
function sub(key, q, map) {
  const timer = setTimeout(() => { if (!S.loaded[key]) { S.loaded[key] = 'slow'; emit(key); } }, 10000);
  const un = q.onSnapshot(
    (snap) => { map(snap); if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); S.loaded[key] = true; } else if (!S.loaded[key]) S.loaded[key] = 'cache'; emit(key); },
    (e) => { clearTimeout(timer); S.loaded[key] = 'error'; console.warn(key, e); emit(key); },
  );
  S.subs.push(un);
  return un;
}
const docsOf = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));

let inboxUnsub = null;
function subInbox() {
  inboxUnsub && inboxUnsub();
  inboxUnsub = sub('inbox', S.st.db.collection('inbox').orderBy('day', 'desc').limit(S.inboxLimit), (snap) => {
    const msgs = [];
    const buckets = {};
    for (const d of snap.docs) {
      const b = d.data();
      buckets[d.id] = true;
      for (const [id, m] of Object.entries(b.msgs || {})) msgs.push({ id, seat: b.seat, bucket: d.id, ...m });
    }
    msgs.sort((a, b) => a.ts - b.ts);
    S.data.inbox = msgs;
    S.inboxBuckets = buckets;
    S.inboxHasMore = snap.size >= S.inboxLimit;
  });
}

function startSubs() {
  const db = S.st.db;
  sub('members', db.doc('space/members'), (snap) => {
    const seats = (snap.exists && snap.data().seats) || {};
    S.members = { A: seats.A || null, B: seats.B || null };
    const ids = [seats.A && seats.A.id, seats.B && seats.B.id].filter(Boolean);
    S.st.names(ids).then((n) => { S.profileNames = n; emit('names'); });
  });
  subInbox();
  sub('photos', db.collection('photos'), (s) => { S.data.photos = docsOf(s); });
  sub('lockers', db.collection('lockers'), (s) => { S.data.lockers = docsOf(s); });
  sub('notes', db.collection('notes'), (s) => { S.data.notes = docsOf(s); });
  sub('contacts', db.collection('contacts'), (s) => { S.data.contacts = docsOf(s); });
  sub('dates', db.collection('dates'), (s) => { S.data.dates = docsOf(s); checkBrowserReminders(); });
  sub('profiles', db.collection('profiles'), (s) => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.data.profiles = o; });
  sub('events', db.collection('events'), (s) => { S.data.events = docsOf(s); });
  let first = true;
  sub('mine', myPrivColl(), (s) => {
    const all = docsOf(s);
    S.data.mine = all;
    const p = all.find((d) => d.id === 'prefs');
    S.prefs = p || {};
    if (first && s.metadata && !s.metadata.fromCache) { first = false; S.bootLastSeen = S.prefs.lastSeenTs || 0; }
    else if (first && !s.metadata) { first = false; S.bootLastSeen = S.prefs.lastSeenTs || 0; }
  });
}

/* ---------- prefs ---------- */
let prefsWriting = Promise.resolve();
function savePrefs(patch) {
  const ref = myPrivColl().doc('prefs');
  prefsWriting = prefsWriting.then(async () => {
    const exists = S.data.mine.some((d) => d.id === 'prefs');
    S.prefs = { ...S.prefs, ...patch };
    try {
      if (exists) await ref.update(patch); else await ref.set({ kind: 'prefs', ...S.prefs });
    } catch (e) { console.warn('prefs', e); }
  });
  return prefsWriting;
}
let seenT = null, seenPending = 0;
function markSeen(ts) {
  if (ts <= (S.prefs.lastSeenTs || 0)) return;
  seenPending = Math.max(seenPending, ts);
  if (!seenT) seenT = setTimeout(flushSeen, 1200);
}
function flushSeen() {
  clearTimeout(seenT); seenT = null;
  if (seenPending > (S.prefs.lastSeenTs || 0)) savePrefs({ lastSeenTs: seenPending });
}
addEventListener('pagehide', () => seenT && flushSeen());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && seenT) flushSeen(); });

function unreadCount() {
  const last = S.prefs.lastSeenTs || 0;
  return S.data.inbox.filter((m) => m.seat !== S.me.seat && m.ts > last && !m.del).length;
}

/* ---------- reminders (browser notifications after opt-in) ---------- */
function checkBrowserReminders() {
  if (!S.prefs.notify || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const fired = lsGet('oss.fired', {});
  for (const r of activeReminders()) {
    const key = r.ev.id + ':' + isoOf(r.next);
    if (fired[key]) continue;
    try { new Notification(r.ev.title, { body: r.text }); fired[key] = 1; } catch {}
  }
  lsSet('oss.fired', fired);
}

const pageHead = (title, sub, actions = '') =>

/* mobile-visible action row (page-head is desktop only) */

/* ============================================================
   Special dates & reminders
   Dates are stored as wall-calendar days (YYYY-MM-DD) and always
   read in the viewer's own time zone, so an annual date lands on
   the same calendar day for both of you.
   ============================================================ */
const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
function mkDay(y, m, d) { if (m === 2 && d === 29 && !isLeap(y)) d = 28; return new Date(y, m - 1, d); }
function startOfToday() { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function nextOcc(ev, from = startOfToday()) {
  const [y, m, d] = ev.date.split('-').map(Number);
  if (ev.repeat !== 'annual') return mkDay(y, m, d);
  let dt = mkDay(from.getFullYear(), m, d);
  if (dt < from) dt = mkDay(from.getFullYear() + 1, m, d);
  return dt;
}
const daysUntil = (dt) => Math.round((dt - startOfToday()) / 86400000);
const relDays = (n) => (n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n < 0 ? `${-n} days ago` : n < 7 ? `In ${n} days` : n < 60 ? `In ${Math.round(n / 7)} week${Math.round(n / 7) > 1 ? 's' : ''}` : `In ${Math.round(n / 30)} months`);
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function occLabel(ev, next) {
  const y0 = Number(ev.date.slice(0, 4));
  const n = next.getFullYear() - y0;
  if (ev.repeat !== 'annual' || !ev.knowYear || n <= 0) return '';
  if (ev.type === 'Birthday') return `turns ${n}`;
  if (ev.type === 'Anniversary') return `${ordinal(n)} anniversary`;
  return `${ordinal(n)} time`;
}
function upcoming(n = 50) {
  return S.data.dates
    .map((ev) => { const next = nextOcc(ev); return { ev, next, days: daysUntil(next) }; })
    .filter((x) => x.days >= 0)
    .sort((a, b) => a.days - b.days || (a.ev.time || '').localeCompare(b.ev.time || ''))
    .slice(0, n);
}
function activeReminders() {
  return upcoming(200)
    .filter((x) => x.ev.remind != null && x.ev.remind >= 0 && x.days <= x.ev.remind)
    .map((x) => ({ ...x, key: x.ev.id + ':' + isoOf(x.next), text: `${relDays(x.days)} · ${fmtDate(x.next, { weekday: 'long', day: 'numeric', month: 'long' })}${x.ev.time ? ' at ' + x.ev.time : ''}` }));
}
const calTile = (dt) => `<span class="cal" aria-hidden="true"><b>${dt.getDate()}</b><small>${dt.toLocaleDateString(undefined, { month: 'short' })}</small></span>`;
function upcomingList(ups) {
  if (!ups.length) return `<div class="empty">${icon('star', 'spark')}<strong>No dates yet</strong>Add birthdays, anniversaries and plans so they show up here.</div>`;
  return `<div class="up-list">${ups.map((u) => `<button class="up" data-ev="${esc(u.ev.id)}">${calTile(u.next)}<span><span class="t">${esc(u.ev.title)}</span><br><span class="s"><span class="${u.days <= 7 ? 'soon' : ''}">${esc(relDays(u.days))}</span>${occLabel(u.ev, u.next) ? ' · ' + esc(occLabel(u.ev, u.next)) : ''}</span></span></button>`).join('')}</div>`;
}
function bindUpcoming(el) {
  $$('[data-ev]', el).forEach((b) => (b.onclick = () => { const ev = S.data.dates.find((d) => d.id === b.dataset.ev); ev && openDateForm(ev); }));
}

function openDateForm(ev) {

        <label class="field"><span>Date</span><input name="date" type="date" required value="${esc(e.date || '')}"></label>
        <label class="field"><span>Time (optional)</span><input name="time" type="time" value="${esc(e.time || '')}"></label>
      </div>
      <label class="check"><input type="checkbox" name="repeat" ${e.repeat === 'annual' ? 'checked' : ''}> Repeats every year</label>
      <label class="check"><input type="checkbox" name="knowYear" ${e.knowYear !== false ? 'checked' : ''}> The year is real (show age or years together)</label>
      <label class="field" style="margin-top:8px"><span>Remind us</span><select name="remind">${REMIND_OPTS.map(([v, l]) => `<option value="${v}" ${Number(e.remind ?? -1) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field"><span>Note (optional)</span><textarea name="note" maxlength="2000">${esc(e.note || '')}</textarea></label>
      ${ev ? `<p class="hint">Added by ${esc(nameOf(ev.seat))} · ${esc(fmtStamp(ev.at))}${ro ? ` — only ${esc(nameOf(ev.seat))} can change or delete it` : ''}</p>` : ''}
    </form>`,
    foot: ro ? '<button class="btn" data-x2>Close</button>' : `${ev ? `<button class="btn ghost left" data-del>${icon('trash')}Delete</button>` : ''}<button class="btn ghost" data-x2>Cancel</button><button class="btn" data-save>${ev ? 'Save changes' : 'Add date'}</button>`,
    onMount: (m, close) => {

      $('[data-save]', m).onclick = async () => {

          repeat: f.repeat.checked ? 'annual' : 'once', knowYear: f.knowYear.checked, remind: Number(f.remind.value), note: f.note.value.trim(),
          tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
        };
        const btn = $('[data-save]', m); btn.disabled = true; btn.textContent = 'Saving…';
        try {

          else await retryOnce(() => S.st.db.collection('dates').doc(uid()).set({ ...body, seat: S.me.seat, at: Date.now() }));
          toast(ev ? 'Date saved' : 'Date added'); close();
        } catch (er) { toast(errText(er), 'err'); btn.disabled = false; btn.textContent = 'Try again'; }
      };
      const d = $('[data-del]', m);
      if (d) d.onclick = async () => {

        try { await S.st.db.doc('dates/' + ev.id).delete(); toast('Date deleted'); close(); } catch (er) { toast(errText(er), 'err'); }
      };
    },
  });
}

  unmount() { this.off && this.off(); },
  row(u) {

    return `<button class="date-row" data-ev="${esc(u.ev.id)}">${calTile(u.next)}
      <span style="min-width:0"><span style="font-weight:700;font-size:13px;display:block">${esc(u.ev.title)}</span><span class="s" style="color:var(--text-dim);font-size:11px">${esc(extra)}</span>${u.ev.remind >= 0 ? `<span style="display:block;font-size:11px;color:var(--text-dim)">${icon('bell').replace('<svg', '<svg style="width:13px;height:13px;vertical-align:-2px"')} ${esc(REMIND_OPTS.find(([v]) => v === u.ev.remind)[1])}</span>` : ''}</span>
      <span class="when ${u.days === 0 ? 'today' : ''}">${esc(u.days < 0 ? 'Passed' : relDays(u.days))}</span></button>`;
  },
  listHtml() {
    if (!S.data.dates.length) return `<div class="empty">${icon('star', 'spark')}<strong>Nothing on the calendar yet</strong>Start with a birthday or the day you met. Yearly dates come back around on their own.</div>`;
    const ups = upcoming(500);
    const past = S.data.dates.filter((e) => e.repeat !== 'annual' && daysUntil(nextOcc(e)) < 0)
      .map((ev) => { const next = nextOcc(ev); return { ev, next, days: daysUntil(next) }; }).sort((a, b) => b.next - a.next);
    const notif = typeof Notification !== 'undefined' && !(S.prefs.notify && Notification.permission === 'granted');
    return `${notif ? `<div class="banner">${icon('bell')}<span style="flex:1">Reminders always show in your inbox. You can also get alerts from this browser.</span><button class="btn sm ghost" id="notifyBtn">Turn on alerts</button></div>` : ''}
      <h2 class="sec" style="margin-top:6px">Upcoming</h2>${ups.length ? ups.map((u) => this.row(u)).join('') : '<p class="hint">Nothing ahead.</p>'}
      ${past.length ? `<h2 class="sec">Already happened</h2>${past.map((u) => this.row(u)).join('')}` : ''}`;
  },
  calHtml() {
    const m = this.month, y = m.getFullYear(), mo = m.getMonth();
    const first = new Date(y, mo, 1);
    const startDow = (first.getDay() + 6) % 7; // Monday first
    const start = new Date(y, mo, 1 - startDow);
    const today = isoOf(new Date());
    const byDay = {};
    for (const ev of S.data.dates) {
      const [ey, em, ed] = ev.date.split('-').map(Number);
      for (const yy of [y - 1, y, y + 1]) {
        if (ev.repeat !== 'annual' && yy !== ey) continue;
        if (ev.repeat === 'annual' && yy < ey) continue;
        const dt = mkDay(yy, em, ed); const k = isoOf(dt);
        (byDay[k] = byDay[k] || []).push(ev);
      }
    }
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const k = isoOf(d); const evs = byDay[k] || [];
      cells += `<button data-day="${k}" class="${d.getMonth() !== mo ? 'out' : ''} ${k === today ? 'today' : ''} ${k === this.sel ? 'sel' : ''}" aria-label="${esc(fmtDate(d, { weekday: 'long', day: 'numeric', month: 'long' }))}${evs.length ? ', ' + evs.length + ' date' + (evs.length > 1 ? 's' : '') : ''}">${d.getDate()}${evs.length ? `<span class="dots">${evs.slice(0, 3).map(() => '<i></i>').join('')}</span>` : ''}</button>`;
    }
    const sel = this.sel && byDay[this.sel];
    const dows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    return `<div class="month" style="max-width:620px">
      <div class="month-h"><button data-pm aria-label="Previous month">${icon('left')}</button><span>${esc(m.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</span><button data-nm aria-label="Next month">${icon('right')}</button></div>
      <div class="dow">${dows.map((d) => `<span>${d}</span>`).join('')}</div><div class="days">${cells}</div></div>
      <div style="max-width:620px;margin-top:16px">${this.sel ? `<h2 class="sec" style="margin-top:0">${esc(fmtDate(this.sel, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))}</h2>${sel ? sel.map((ev) => this.row({ ev, next: parseISO(this.sel), days: daysUntil(parseISO(this.sel)) })).join('') : '<p class="hint">Nothing on this day.</p>'}` : '<p class="hint">Tap a day to see what’s on it.</p>'}</div>`;
  },
};

async function enableNotifications() {
  if (typeof Notification === 'undefined') { toast('This browser can’t show alerts here. Reminders still appear in your inbox.', 'err'); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') { await savePrefs({ notify: true }); toast('Alerts are on for this browser'); checkBrowserReminders(); }
    else toast('Alerts are blocked here. Reminders still appear in your inbox.', 'err');
  } catch { toast('This view can’t ask for alerts. Reminders still appear in your inbox.', 'err'); }
  emit('mine');
}

/* ============================================================
   Inbox — the emotional centre. Durable, per-day buckets per person.
   ============================================================ */
const Outbox = {
  key: () => 'oss.outbox.' + S.me.id,
  items: null,
  load() {
    if (this.items) return this.items;
    this.items = lsGet(this.key(), []).map((i) => (i.state === 'saving' ? { ...i, state: 'failed', err: 'This message was still saving when the page closed.' } : i));
    return this.items;
  },
  save() { lsSet(this.key(), this.items.filter((i) => i.state !== 'saved')); },
};
const knownBuckets = new Set();
let writeChain = Promise.resolve();
let lastSavedId = null;

function bucketId(ts) { return new Date(ts).toISOString().slice(0, 10) + '~' + S.me.seat; }

function queueWrite(item) {
  item.state = 'saving'; item.err = '';
  Outbox.save(); emit('outbox');
  writeChain = writeChain.then(async () => {
    const bid = bucketId(item.ts);
    const ref = S.st.db.doc('inbox/' + bid);
    const m = { t: item.t, ts: item.ts, by: S.me.id };
    try {
      await retryOnce(async () => {
        let exists = (S.inboxBuckets && S.inboxBuckets[bid]) || knownBuckets.has(bid);
        if (!exists) exists = (await ref.get()).exists;
        if (exists) {
          try { await ref.update({ msgs: { [item.id]: m } }); }
          catch (e) {
            if (e && e.code === 'invalid_argument' && !(await ref.get()).exists) await ref.set({ day: bid.slice(0, 10), seat: S.me.seat, msgs: { [item.id]: m } });
            else throw e;
          }
        } else await ref.set({ day: bid.slice(0, 10), seat: S.me.seat, msgs: { [item.id]: m } });
      });
      knownBuckets.add(bid);
      item.state = 'saved';
      lastSavedId = item.id;
      Outbox.items = Outbox.items.filter((i) => i !== item);
      markSeen(item.ts);
    } catch (e) {
      item.state = 'failed';
      item.err = errText(e);
    }
    Outbox.save(); emit('outbox');
  });
  return writeChain;
}

function sendMessage(text) {
  const ts = Date.now();
  const item = { id: 'm' + ts.toString(36) + Math.random().toString(36).slice(2, 6), t: text, ts, state: 'saving' };
  Outbox.load().push(item);
  return queueWrite(item);
}

async function deleteMessage(m) {
  if (!(await confirmBox('Delete this message for both of you? A “message deleted” marker stays in its place.', 'Delete message'))) return;
  try {
    await retryOnce(() => S.st.db.doc('inbox/' + m.bucket).update({ msgs: { [m.id]: { del: true, t: '' } } }));
    toast('Message deleted');
  } catch (e) { toast(errText(e), 'err'); }
}

function linkify(t) {
  return esc(t).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}

/* ---------- search ---------- */
function openSearch() {
  const p = partnerSeat();
  openModal({
    title: 'Search messages', wide: true,
    body: `<div class="row">
        <label class="field" style="flex:2 1 220px"><span>Words</span><input id="sq" type="search" placeholder="e.g. Goa, passport, dinner" autofocus></label>
        <label class="field"><span>Written by</span><select id="sw"><option value="">Either of you</option><option value="${S.me.seat}">You</option><option value="${p}">${esc(nameOf(p))}</option></select></label>
      </div>
      <div class="row">
        <label class="field"><span>From</span><input id="sf" type="date"></label>
        <label class="field"><span>To</span><input id="st" type="date"></label>
      </div>
      <div id="sres" aria-live="polite"><p class="hint">Loading your full history…</p></div>`,
    onMount: async (m, close) => {
      let all = [];
      try {
        const snap = await retryOnce(() => S.st.db.collection('inbox').get());
        for (const d of snap.docs) { const b = d.data(); for (const [id, x] of Object.entries(b.msgs || {})) if (!x.del) all.push({ id, seat: b.seat, bucket: d.id, ...x }); }
      } catch (e) { all = S.data.inbox.filter((x) => !x.del); }
      all.sort((a, b) => b.ts - a.ts);
      const run = () => {
        const q = $('#sq', m).value.trim().toLowerCase();
        const w = $('#sw', m).value, f = $('#sf', m).value, t = $('#st', m).value;
        const from = f ? parseISO(f).getTime() : 0, to = t ? parseISO(t).getTime() + 86400000 : Infinity;
        const res = all.filter((x) => (!q || x.t.toLowerCase().includes(q)) && (!w || x.seat === w) && x.ts >= from && x.ts < to);
        const hl = (s) => { const e = esc(s); if (!q) return e; const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/&/g, '&amp;').replace(/</g, '&lt;') + ')', 'gi'); return e.replace(re, '<mark>$1</mark>'); };
        $('#sres', m).innerHTML = !q && !w && !f && !t
          ? `<p class="hint">${all.length} saved messages. Type a word or pick dates to search.</p>`
          : res.length
            ? `<p class="hint">${res.length} found</p><div class="rows">${res.slice(0, 200).map((x) => `<button class="rowi" style="grid-template-columns:1fr auto" data-j="${esc(x.id)}"><div style="min-width:0"><div class="s"><b style="color:var(--frost)">${esc(x.seat === S.me.seat ? 'You' : nameOf(x.seat))}</b> · ${esc(fmtStamp(x.ts))}</div><div style="white-space:pre-wrap;margin-top:4px">${hl(x.t.length > 400 ? x.t.slice(0, 400) + '…' : x.t)}</div></div><span class="r">Show</span></button>`).join('')}</div>`
            : `<div class="empty"><strong>Nothing matches</strong>Try fewer words or a wider date range.</div>`;
        $$('[data-j]', m).forEach((b) => (b.onclick = () => {
          pendingJump = b.dataset.j; close();
          if (S.inboxLimit < 1000) { S.inboxLimit = 1000; subInbox(); } else emit('inbox');
        }));
      };
      ['input', 'change'].forEach((ev) => $$('input,select', m).forEach((i) => i.addEventListener(ev, run)));
      run();
    },
  });
}

    if (!S.st.assets) $('#upBtn', el).outerHTML = `<p class="hint">You can view photos. To add photos, ask the space owner to give you Editor access.</p>`;
    $('#psort', el).value = this.sort;
    $('#psort', el).onchange = (e) => { this.sort = e.target.value; draw(); };
    const pf = $('#pf', el);
    if (pf) pf.onchange = () => { const files = [...pf.files]; pf.value = ''; if (files.length) openPhotoUpload(files); };
    const draw = () => {
      const albums = [...new Set(S.data.photos.map((p) => p.album).filter(Boolean))].sort();
      if (this.album && !albums.includes(this.album)) this.album = '';
      $('#albums', el).innerHTML = albums.length ? [['', 'All photos'], ...albums.map((a) => [a, a])].map(([v, l]) => `<button class="chip" data-al="${esc(v)}" aria-pressed="${v === this.album}">${esc(l)}</button>`).join('') : '';
      $$('[data-al]', el).forEach((b) => (b.onclick = () => { this.album = b.dataset.al; draw(); }));
      const list = this.list();
      const g = $('#pgrid', el);
      if (!S.data.photos.length) {
        g.innerHTML = S.loaded.photos ? `<div class="empty">${icon('star', 'spark')}<strong>No photos yet</strong>Add a few from your phone or computer. You can group them into albums as you go.</div>` : `<p class="hint">Loading photos…</p>`;
        return;

      $$('[data-i]', g).forEach((b) => (b.onclick = () => openViewer(this.list(), Number(b.dataset.i))));
      hydrate(g);
    };

  },
  list() {
    const l = S.data.photos.filter((p) => !this.album || p.album === this.album).sort((a, b) => photoSortKey(b).localeCompare(photoSortKey(a)));
    return this.sort === 'old' ? l.reverse() : l;
  },
  unmount() { this.off && this.off(); },
};

function openPhotoUpload(files) {
  const albums = [...new Set(S.data.photos.map((p) => p.album).filter(Boolean))];
  const lm = files[0].lastModified ? isoOf(new Date(files[0].lastModified)) : todayISO();
  const previews = files.slice(0, 24).map((f) => URL.createObjectURL(f));
  openModal({
    title: `Add ${files.length} photo${files.length > 1 ? 's' : ''}`,
    body: `<div class="thumbs">${previews.map((u) => `<img src="${u}" alt="">`).join('')}${files.length > 24 ? `<p class="hint">+${files.length - 24} more</p>` : ''}</div>
      <form id="puf">
        <label class="field"><span>Caption (optional)</span><input name="caption" maxlength="300" placeholder="Where were you? What happened?"></label>
        <div class="row">
          <label class="field"><span>Album (optional)</span><input name="album" list="albumList" maxlength="60" placeholder="e.g. Goa 2026"><datalist id="albumList">${albums.map((a) => `<option value="${esc(a)}">`).join('')}</datalist></label>
          <label class="field"><span>Date</span><input name="date" type="date" value="${lm}"></label>
        </div>
        <p class="hint">JPG, PNG, WebP, GIF or HEIC. Large photos are resized to save space; a small preview is made for the grid.</p>
        <div class="progress" hidden><i></i></div>
        <div id="upErr" role="alert"></div>
      </form>`,
    foot: `<button class="btn ghost" data-x2>Cancel</button><button class="btn" data-go>${icon('upload')}Upload ${files.length}</button>`,
    onClose: () => previews.forEach((u) => URL.revokeObjectURL(u)),
    onMount: (m, close) => {
      $('[data-x2]', m).onclick = () => close();
      $('[data-go]', m).onclick = async () => {
        const f = $('#puf', m), go = $('[data-go]', m);
        go.disabled = true; $('[data-x2]', m).disabled = true;
        const bar = $('.progress', m); bar.hidden = false;
        const errs = [];
        let done = 0;
        for (const file of files) {
          try {
            const { thumb, full, w, h } = await prepPhoto(file);
            const fu = await upload(full, full.type || 'image/jpeg');
            const tu = await upload(thumb, 'image/jpeg');
            await retryOnce(() => S.st.db.collection('photos').doc(uid()).set({
              full: fu.id, thumb: tu.id, w, h, size: fu.sizeBytes, name: file.name,
              caption: f.caption.value.trim(), album: f.album.value.trim(), date: f.date.value || todayISO(),
              seat: S.me.seat, at: Date.now(),
            }));
          } catch (e) { errs.push(`${file.name}: ${e.message && e.code === 'decode' ? e.message : errText(e)}`); }
          done++; $('i', bar).style.width = (done / files.length) * 100 + '%';
          go.textContent = `Uploading ${done}/${files.length}…`;
        }
        if (errs.length) {
          $('#upErr', m).innerHTML = `<div class="banner" style="margin-top:12px">${errs.length} couldn’t be added:<br>${errs.map(esc).join('<br>')}</div>`;
          go.textContent = 'Done'; go.disabled = false; go.onclick = () => close();
          $('[data-x2]', m).disabled = false;
          if (errs.length < files.length) toast(`${files.length - errs.length} photo${files.length - errs.length > 1 ? 's' : ''} added`);
        } else { toast(`${files.length} photo${files.length > 1 ? 's' : ''} added`); close(); }
      };
    },
  });
}

function openViewer(list, i, opts = {}) {
  const v = document.createElement('div');
  v.className = 'viewer'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true'); v.setAttribute('aria-label', 'Photo viewer');
  document.body.appendChild(v);
  const prevFocus = document.activeElement;
  const close = () => { v.remove(); document.removeEventListener('keydown', key); modalStack.splice(modalStack.indexOf(close), 1); prevFocus && prevFocus.focus(); };
  modalStack.push(close);
  const draw = () => {
    const p = list[i];
    if (!p) return close();
    const ro = opts.readOnly || (p.seat && p.seat !== S.me.seat);
    v.innerHTML = `<div class="vtop"><span>${i + 1} of ${list.length}</span><span class="row" style="gap:4px">
        ${ro ? '' : `<button class="icon-btn" data-ed aria-label="Edit details">${icon('edit')}</button>`}
        <button class="icon-btn" data-dl aria-label="Download">${icon('download')}</button>
        ${ro ? '' : `<button class="icon-btn" data-del aria-label="Delete photo">${icon('trash')}</button>`}
        <button class="icon-btn" data-c aria-label="Close">${icon('close')}</button></span></div>
      <div class="stage"><img data-asset="${esc(p.full)}" alt="${esc(p.caption || 'Photo')}">
        ${list.length > 1 ? `<button class="nav prev" data-p aria-label="Previous photo">${icon('left')}</button><button class="nav next" data-n aria-label="Next photo">${icon('right')}</button>` : ''}</div>
      <div class="vinfo">${p.caption ? `<p style="font-weight:700;font-size:13px">${esc(p.caption)}</p>` : ''}
        ${opts.readOnly ? '' : `<p class="s">${esc(p.date ? fmtDate(p.date, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' }) : '')}${p.album ? ' · ' + esc(p.album) : ''} · added by ${esc(nameOf(p.seat))}${ro && !opts.readOnly ? ' — only they can edit or delete it' : ''}</p>`}</div>`;
    hydrate(v);
    $('[data-c]', v).onclick = close;
    const pv = $('[data-p]', v), nx = $('[data-n]', v);
    if (pv) pv.onclick = () => { i = (i - 1 + list.length) % list.length; draw(); };
    if (nx) nx.onclick = () => { i = (i + 1) % list.length; draw(); };
    $('[data-dl]', v).onclick = async () => {
      try { const url = await assetUrl(p.full); const b = await (await fetch(url)).blob(); await saveFile(p.name || 'photo.jpg', b); } catch { toast('Couldn’t download this photo.', 'err'); }
    };
    if (!ro) $('[data-del]', v).onclick = async () => {
      if (!(await confirmBox('Delete this photo for both of you? This can’t be undone.', 'Delete photo'))) return;
      try {
        await S.st.db.doc('photos/' + p.id).delete();
        if (S.st.assets) { S.st.assets.delete(p.full).catch(() => {}); if (p.thumb) S.st.assets.delete(p.thumb).catch(() => {}); }
        list.splice(i, 1); if (i >= list.length) i = list.length - 1; toast('Photo deleted'); draw();
      } catch (e) { toast(errText(e), 'err'); }
    };
    if (!ro) $('[data-ed]', v).onclick = () => editPhoto(p, (np) => { list[i] = np; draw(); });
    $('[data-c]', v).focus();
  };
  const key = (e) => {
    if (modalStack[modalStack.length - 1] !== close) return;
    if (e.key === 'ArrowLeft' && list.length > 1) { i = (i - 1 + list.length) % list.length; draw(); }
    if (e.key === 'ArrowRight' && list.length > 1) { i = (i + 1) % list.length; draw(); }
  };
  document.addEventListener('keydown', key);
  let sx = null;
  v.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  v.addEventListener('touchend', (e) => {
    if (sx == null || list.length < 2) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) { i = (i + (dx < 0 ? 1 : -1) + list.length) % list.length; draw(); }
  });
  draw();
}

function allNotes() {
  const shared = S.data.notes.map((n) => ({ ...n, priv: false }));
  const mine = S.data.mine.filter((d) => d.kind === 'note').map((n) => ({ ...n, priv: true }));
  return [...shared, ...mine].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.editedAt || b.at || 0) - (a.editedAt || a.at || 0));
}
const noteRef = (n) => (n.priv ? myPrivColl().doc(n.id) : S.st.db.doc('notes/' + n.id));
function mdLite(src) {
  const lines = esc(src).split('\n');
  let out = '', inList = false;
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|\W)_(.+?)_(?=\W|$)/g, '$1<i>$2</i>').replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)]/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  for (const l of lines) {
    if (/^[-*] /.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(l.slice(2))}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if (/^#{1,3} /.test(l)) out += `<h4>${inline(l.replace(/^#+ /, ''))}</h4>`;
    else out += l ? `<div>${inline(l)}</div>` : '<div>&nbsp;</div>';
  }
  if (inList) out += '</ul>';
  return out;
}

/* ---------- rich text: colours, photos, sanitizing ---------- */
const NOTE_COLORS = [
  ['ink', '#1A1030', 'Ink'], ['pink', '#D4136F', 'Hot pink'], ['purple', '#6A2BD6', 'Purple'], ['blue', '#1A57C9', 'Blue'],
  ['teal', '#0B7C82', 'Teal'], ['green', '#2A7D2A', 'Green'], ['orange', '#C2570A', 'Orange'], ['red', '#B8102C', 'Red'],
];
const colorClassOf = (raw) => {
  if (!raw) return null;
  let hex = String(raw).trim().toLowerCase();
  const m = hex.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
  if (m) hex = '#' + [m[1], m[2], m[3]].map((x) => Number(x).toString(16).padStart(2, '0')).join('');
  const hit = NOTE_COLORS.find(([, h]) => h.toLowerCase() === hex);
  return hit ? 'c-' + hit[0] : null;
};
function sanitizeNote(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html || '');

      if (!KEEP.has(tag)) { const frag = document.createDocumentFragment(); while (ch.firstChild) frag.appendChild(ch.firstChild); ch.replaceWith(frag); continue; }

      const href = tag === 'A' ? ch.getAttribute('href') : null;
      for (const a of [...ch.attributes]) ch.removeAttribute(a.name);
      if (tag === 'SPAN') { if (cls) ch.className = cls; else { const frag = document.createDocumentFragment(); while (ch.firstChild) frag.appendChild(ch.firstChild); ch.replaceWith(frag); } }

  };

function openContact(c) {
  const x = c || { category: 'Family', dates: [] };
  const dateRow = (d = {}) => `<div class="row cdate" style="gap:8px;margin-bottom:8px"><input class="input" style="flex:2 1 140px" placeholder="e.g. Birthday" value="${esc(d.label || '')}" aria-label="Date label"><input class="input" type="date" style="flex:1 1 140px" value="${esc(d.date || '')}" aria-label="Date"><button type="button" class="icon-btn" data-rmd aria-label="Remove date">${icon('close')}</button></div>`;
  const ro = !!(c && c.seat && c.seat !== S.me.seat);
  openModal({
    title: c ? c.name : 'Add contact',
    body: `<form id="cf"><fieldset class="ro-fs" ${ro ? 'disabled' : ''}>
      <label class="field"><span>Name</span><input name="name" required maxlength="120" value="${esc(x.name || '')}"></label>
      <div class="row"><label class="field"><span>Relationship</span><input name="relation" maxlength="80" value="${esc(x.relation || '')}" placeholder="e.g. Maya’s sister"></label>
      <label class="field"><span>Category</span><select name="category">${CONTACT_CATS.map((k) => `<option ${k === x.category ? 'selected' : ''}>${k}</option>`).join('')}</select></label></div>
      <div class="row"><label class="field"><span>Phone</span><input name="phone" type="tel" maxlength="40" value="${esc(x.phone || '')}"></label>
      <label class="field"><span>Email</span><input name="email" type="email" maxlength="120" value="${esc(x.email || '')}"></label></div>
      ${c && (c.phone || c.email) ? `<p class="hint" style="margin-top:-6px;margin-bottom:12px">${c.phone ? `Call: <a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${esc(c.phone)}</a> ` : ''}${c.email ? ` Email: <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}</p>` : ''}
      <label class="field"><span>Address (optional)</span><textarea name="address" maxlength="500" style="min-height:70px">${esc(x.address || '')}</textarea></label>
      <div class="lbl" style="margin-bottom:8px">Important dates</div><div id="cdates">${(x.dates || []).map(dateRow).join('')}</div>
      <button type="button" class="btn ghost sm" id="addD" style="margin-bottom:14px">${icon('plus')}Add a date</button>
      <label class="field"><span>Notes</span><textarea name="notes" maxlength="2000">${esc(x.notes || '')}</textarea></label>
      </fieldset>${c ? `<p class="hint">Added by ${esc(nameOf(c.seat))} · ${esc(fmtStamp(c.at))}${ro ? ` — only ${esc(nameOf(c.seat))} can change or delete it` : ''}</p>` : ''}
    </form>`,
    foot: ro ? '<button class="btn" data-x2>Close</button>' : `${c ? `<button class="btn ghost left" data-del>${icon('trash')}Delete</button>` : ''}<button class="btn ghost" data-x2>Cancel</button><button class="btn" data-s>${c ? 'Save changes' : 'Add contact'}</button>`,
    onMount: (m, close) => {
      const f = $('#cf', m);
      if (ro) { $('[data-x2]', m).onclick = () => close(); return; }
      const bindRm = () => $$('[data-rmd]', m).forEach((b) => (b.onclick = () => b.closest('.cdate').remove()));
      bindRm();
      $('#addD', m).onclick = () => { $('#cdates', m).insertAdjacentHTML('beforeend', dateRow()); bindRm(); };
      $('[data-x2]', m).onclick = () => close();
      $('[data-s]', m).onclick = async () => {
        if (!f.reportValidity()) return;
        const body = {
          name: f.name.value.trim(), relation: f.relation.value.trim(), category: f.category.value, phone: f.phone.value.trim(), email: f.email.value.trim(),
          address: f.address.value.trim(), notes: f.notes.value.trim(),
          dates: $$('.cdate', m).map((r) => ({ label: $$('input', r)[0].value.trim(), date: $$('input', r)[1].value })).filter((d) => d.label || d.date),
        };
        try {
          if (c) await retryOnce(() => S.st.db.doc('contacts/' + c.id).update(body));
          else await retryOnce(() => S.st.db.collection('contacts').doc(uid()).set({ ...body, seat: S.me.seat, at: Date.now() }));
          toast(c ? 'Contact saved' : 'Contact added'); close();
        } catch (e) { toast(errText(e), 'err'); }
      };
      const d = $('[data-del]', m);
      if (d) d.onclick = async () => {
        if (!(await confirmBox(`Delete ${c.name} from your contacts?`, 'Delete contact'))) return;
        try { await S.st.db.doc('contacts/' + c.id).delete(); toast('Contact deleted'); close(); } catch (e) { toast(errText(e), 'err'); }
      };
    },
  });
}

  };

    ['rhythm, wealth, generosity and ambition', 'pride, impatience and materialism', 'sociable and generous', 'music, real estate, sport and science'],
    ['healing, research, independence and truthfulness', 'secretiveness, loneliness and stubbornness', 'you need space, but are deeply loyal once you trust', 'medicine, research, astronomy and technology'],
    ['idealism, passion, intensity and generosity', 'extremes, anxiety and cynicism', 'intense and idealistic', 'spiritual work, research, finance and the occult'],
    ['wisdom, self-control, kindness and depth', 'laziness and withdrawal', 'calm, devoted and protective', 'counselling, charity, research and spiritual teaching'],
    ['compassion, creativity, gentleness and guidance', 'over-sensitivity, naivety and escapism', 'tender and devoted', 'the arts, travel, care work and spirituality'],
  ];

  /* ---------- readings ---------- */
  function grahaReading(k, p) {
    const pl = P[p.key], x = PX[p.key], sun = k.planets.find((q) => q.key === 'Sun');
    const dg = dignity(p.key, p.lon), nk = NAK[p.nak], nx = NX[p.nak];
    const navSign = (p.nak * 4 + p.pada - 1) % 12;
    const strongish = ['exalted', 'moolatrikona', 'own', 'friend'].includes(dg.k), weakish = ['debilitated', 'enemy'].includes(dg.k);
    const out = [];
    out.push(`<h5>What ${pl.name} means</h5><p>${pl.name} (${pl.en}) is the karaka (significator) of ${pl.karaka}. In every chart it describes ${pl.what}. Traditionally it is a ${pl.nat}. In the body it rules the ${x.body}.</p>`);
    out.push(`<h5>${pl.name} in ${signName(p.sign)} — ${p.deg.toFixed(0)}°</h5>${signBlock(p.sign)}<p>Here ${pl.name}’s themes are expressed through ${SIGNS[p.sign].kw}. ${pl.name} is ${dg.t}.</p>`);
    const notes = [];
    if (p.retro && !['Rahu', 'Ketu'].includes(p.key)) notes.push('<b>Retrograde:</b> its energy turns inward and reflective. You revisit these themes, work on them privately and often see the full results later in life — deeper rather than weaker.');

    if (notes.length) out.push(`<p>${notes.join(' ')}</p>`);
    if (k.lagna && p.house) {
      const rules = !['Rahu', 'Ketu'].includes(p.key) ? ruledHouses(p.key, k.lagna.sign) : [];
      const yk = rules.some((r) => [4, 7, 10].includes(r)) && rules.some((r) => [5, 9].includes(r));
      out.push(`<h5>In your ${ord(p.house)} house — ${HOUSES[p.house - 1].name}</h5><p>${HX[p.house - 1][0]} ${pl.name} here traditionally brings <b>${HFX[p.key][p.house - 1]}</b>.</p>${rules.length ? `<p>${pl.name} also rules your ${rules.map(ord).join(' and ')} house${rules.length > 1 ? 's' : ''} (${rules.map((r) => HOUSES[r - 1].a.split(',').slice(0, 2).join(' and')).join('; ')}). It carries those matters into the ${ord(p.house)} house, so the two areas of life are linked in your story.${yk ? ` Ruling both an angle and a trine makes it your <b>yogakaraka</b> — a planet that traditionally brings success and status in its periods.` : ''}</p>` : ''}`);

    out.push(`<h5>Nakshatra ${Astro.NAKS[p.nak]}, pada ${p.pada}</h5><p>${Astro.NAKS[p.nak]} is ruled by ${label(nk[0])}; its deity is ${nk[1]} and its symbol ${nk[2]}. Its nature is ${nk[3]}. It adds <b>${nx[0]}</b> to ${pl.name}, with a shadow side of ${nx[1]}. Pada ${p.pada} falls in the navamsa sign ${signName(navSign)}, giving a ${SIGNS[navSign].el} flavour.</p>`);
    out.push(`<h5>In practice</h5><ul class="facts">${!weakish ? `<li><b>At its best:</b> ${x.strong}.</li>` : ''}${!strongish ? `<li><b>When it struggles:</b> ${x.weak}.</li>` : ''}<li><b>What helps:</b> ${x.adv}.</li><li><b>Traditional supports:</b> its day is ${x.day}, its colours ${x.col}, its gemstone ${x.gem}. Gemstones are traditionally worn only on an astrologer’s advice.</li></ul>`);
    if (['Rahu', 'Ketu'].includes(p.key)) out.push(`<p><b>The nodes</b> are always exactly opposite each other. ${p.key === 'Rahu' ? 'Rahu shows where you are hungry to grow in this life — exciting, but prone to excess.' : 'Ketu shows what you already know from the past and feel detached from — a source of intuition, but also of disinterest.'} They act through their sign lord, here ${label(SIGN_LORD[p.sign])}.</p>`);
    return out.join('');
  }
  function lagnaReading(k) {
    if (!k.lagna) return '<p>The Lagna needs an exact birth time.</p>';
    const s = k.lagna.sign, x = SX[s], lord = SIGN_LORD[s], lp = k.planets.find((q) => q.key === lord), nk = NAK[k.lagna.nak], nx = NX[k.lagna.nak];
    const occ = k.planets.filter((q) => q.house === 1);
    return `<h5>What the Lagna is</h5><p>The Lagna (Ascendant) is the sign rising on the eastern horizon at your birth. It is the most personal point of the chart: your body, health, temperament, instincts and the lens through which you meet life. It is house 1, and every other house is counted from it.</p>
      <h5>Your rising sign: ${signName(s)}</h5>${signBlock(s)}
      <p><b>How you come across:</b> traditionally ${x.look}. People first meet your ${SIGNS[s].kw}.</p>
      <h5>Your Lagna lord: ${label(lord)}</h5><p>${label(lord)} rules your rising sign, so it acts as the captain of your chart. It sits in ${signName(lp.sign)} in your ${ord(lp.house)} house: ${HFX[lord][lp.house - 1]}. Where the Lagna lord goes, your life energy goes — much of your identity flows into ${HOUSES[lp.house - 1].a.split(',').slice(0, 3).join(',')}. It is ${dignity(lord, lp.lon).t}.</p>
      ${occ.length ? `<p><b>Planets in your 1st house:</b> ${occ.map((q) => `${label(q.key)} (${HFX[q.key][0]})`).join('; ')}. They shape your personality strongly.</p>` : ''}
      <h5>Lagna nakshatra: ${Astro.NAKS[k.lagna.nak]}</h5><p>Ruled by ${label(nk[0])} (deity: ${nk[1]}), it adds ${nx[0]} to your outer personality; watch for ${nx[1]}.</p>
      <h5>Health and care</h5><p>The rising sign traditionally points to the ${x.body} as areas to look after.</p>`;
  }
  function rashiReading(k) {
    const m = k.planets.find((q) => q.key === 'Moon'), s = m.sign, x = SX[s], bright = waxing(k);
    return `<h5>What the Rashi is</h5><p>In Vedic astrology your Moon sign (Rashi) matters as much as the Sun sign does in Western astrology. It describes your mind and emotions, what makes you feel safe, how you react under stress and how you care for others. Daily forecasts, Sade Sati and compatibility are all counted from it.</p>
      <h5>Your Moon sign: ${signName(s)}</h5>${signBlock(s)}
      <ul class="facts"><li><b>Emotionally you need:</b> ${SIGNS[s].kw}.</li><li><b>Under stress:</b> ${x.stress}.</li><li><b>What soothes you:</b> ${x.soothe}.</li></ul>
      <h5>The Moon’s condition</h5><p>The Moon is ${dignity('Moon', m.lon).t}. It was <b>${bright ? 'waxing' : 'waning'}</b> at your birth — ${bright ? 'a bright Moon, traditionally a benefic that gives emotional resilience, optimism and popularity' : 'a waning Moon, traditionally more inward, sensitive and spiritual, gaining strength through reflection'}.${k.lagna ? ` It sits in your ${ord(m.house)} house: ${HFX.Moon[m.house - 1]}.` : ''}</p>

  function nakReading(k) {

    return `<h5>What the birth star is</h5><p>The 27 nakshatras (lunar mansions) are older and finer than the 12 signs; each spans 13°20′. Your birth star, the one the Moon occupied when you were born, is used for naming, Dasha timing, compatibility and choosing good days.</p>
      <h5>Your birth star: ${Astro.NAKS[m.nak]}</h5><p>It is ruled by <b>${label(nk[0])}</b>, so your life began in ${label(nk[0])}’s Mahadasha. Its deity is ${nk[1]} and its symbol ${nk[2]}. Its nature: ${nk[3]}.</p>
      <ul class="facts"><li><b>Strengths:</b> ${nx[0]}.</li><li><b>Challenges:</b> ${nx[1]}.</li><li><b>In love:</b> ${nx[2]}.</li><li><b>Work it suits:</b> ${nx[3]}.</li></ul>
      <h5>Classifications used in matching</h5><ul class="facts"><li><b>Gana ${gana}:</b> ${JY.GANA_MEAN[gana]} — your temperament and pace of reaction.</li><li><b>Yoni ${YONI_NAMES[y]}:</b> ${JY.YONI_MEAN[y]} — your instinctive and physical nature.</li><li><b>Nadi ${NADI_NAMES[nd]}:</b> ${JY.NADI_MEAN[nd].split(' — ')[1]} — your constitution in Ayurvedic terms.</li></ul>`;
  }
  const AIM = ['dharma — living your purpose and duty', 'artha — building resources, skills and security', 'kama — love, pleasure and fulfilled desires', 'moksha — inner freedom and spiritual peace'];
  function padaReading(k) {
    const m = k.planets.find((q) => q.key === 'Moon'), nav = (m.nak * 4 + m.pada - 1) % 12, el = ['fire', 'earth', 'air', 'water'].indexOf(SIGNS[nav].el);
    return `<h5>What a pada is</h5><p>Each nakshatra is divided into four padas (quarters) of 3°20′. Each pada belongs to one navamsa sign — the D9 chart, which astrologers use to judge marriage, inner strength and the second half of life.</p>
      <h5>Your pada: ${m.pada} of ${Astro.NAKS[m.nak]}</h5><p>It falls in the navamsa sign <b>${signName(nav)}</b>, ruled by ${label(SIGN_LORD[nav])}. This refines your birth star towards ${SIGNS[nav].kw}: ${SX[nav].str}, with the challenge of ${SX[nav].ch}.</p>

  function houseReading(k, h) {

      <h5>Planets here</h5>${occ.length ? `<ul class="facts">${occ.map((q) => `<li><b>${label(q.key)}:</b> ${HFX[q.key][h.n - 1]}.</li>`).join('')}</ul>` : '<p>No planets sit here, so the house is read through its sign and lord. An empty house is not an empty area of life.</p>'}`;

  /* ---------- Guna Milan, each koota in depth ---------- */
  const TARA_TXT = ['Janma (birth star) — familiar, mixed', 'Sampat (wealth) — prosperity together', 'Vipat (danger) — obstacles', 'Kshema (well-being) — comfort and safety', 'Pratyak (obstacle) — opposition', 'Sadhana (achievement) — success together', 'Naidhana (death) — the hardest tara', 'Mitra (friend) — friendship', 'Param Mitra (best friend) — strong support'];

  const YONI_LVL = ['traditional enemies — instinctive friction, as between cat and rat; patience and affection overcome it', 'unfriendly animals — different physical rhythms and needs; talk openly about intimacy', 'neutral animals — a workable, ordinary fit', 'friendly animals — very good physical and instinctive comfort', 'the same animal — perfect instinctive harmony'];
  const MAITRI_LVL = { 5: 'natural friendship of minds — you think alike and enjoy each other’s company', 4: 'very good understanding with small differences', 3: 'a neutral fit — friendship grows with time', 1: 'different outlooks — agree on shared goals rather than every opinion', 0.5: 'quite different outlooks — respect each other’s way of thinking', 0: 'opposed outlooks — conscious respect and humour are needed' };
  const BHAKOOT_TXT = { '1/1': 'the same Moon sign — deep emotional familiarity; you feel like family', '2/12': 'a 2/12 pair — differences over money, spending and family; traditionally a dosha', '3/11': 'a 3/11 pair — supportive, friendly and helpful to each other', '4/10': 'a 4/10 pair — a balance of home and career; you support each other’s duties', '5/9': 'a 5/9 pair — traditionally counted as a dosha, though many astrologers see mental and spiritual affinity', '6/8': 'a 6/8 pair — the hardest distance: worries about health and conflict traditionally', '7/7': 'a 7/7 pair — opposite signs; the classic attraction of opposites and a strong marriage axis' };
  const KX = {
    Varna: { calc: 'Each Moon sign belongs to one of four varnas: water signs Brahmin, fire signs Kshatriya, earth signs Vaishya, air signs Shudra. The point is given when the groom’s varna is equal to or higher than the bride’s.', mean: 'Varna shows each person’s natural orientation in life — towards knowledge, protection, commerce or service — and whether you respect each other’s way of working. It has the lowest weight (1 of 36) because it describes attitude rather than love.', fix: 'A 0 here is common and minor: different priorities in work and spiritual life. Respecting each other’s roles balances it.' },
    Vashya: { calc: 'Moon signs fall into five groups: four-footed, human, water, wild (Leo) and insect (Scorpio); Sagittarius and Capricorn are split at 15°. Each pair has a traditional score from 0 to 2.', mean: 'Vashya means “influence”: how easily you draw each other, adapt to each other and decide who leads. High scores mean mutual attraction and cooperation.', fix: 'A low score is eased by clear agreements on who decides what.' },
    Tara: { calc: 'Count the stars from the bride’s birth star to the groom’s and back; each count divided by 9 gives one of nine taras. Vipat (3), Pratyak (5) and Naidhana (7) score 0; the others score 1.5 in each direction.', mean: 'Tara (destiny) shows whether your birth stars support each other’s health, luck and well-being — whether being together tends to bring good fortune.', fix: 'Traditionally a low Tara is softened when Graha Maitri and Bhakoot are good.' },
    Yoni: { calc: 'Each nakshatra has an animal symbol (14 animals, male and female). Traditional friendships and enmities between the animals give 0–4 points.', mean: 'Yoni describes instinctive, physical and sexual compatibility — comfort with each other’s body, rhythm and habits.', fix: 'Low Yoni is helped by tenderness, open talk about needs and patience with different rhythms.' },
    'Graha Maitri': { calc: 'Compares the planets that rule your two Moon signs, and whether each counts the other as a friend, neutral or enemy.', mean: 'Graha Maitri (planetary friendship) shows mental compatibility — whether your minds, values and ways of thinking agree and how easily you become friends. Many astrologers consider it, with Bhakoot and Nadi, among the most important.', fix: 'Shared interests and respect for each other’s views compensate for low scores.' },
    Gana: { calc: 'Each birth star belongs to one of three temperaments: Deva (divine — gentle), Manushya (human — balanced) or Rakshasa (fierce — strong-willed, not “bad”).', mean: 'Gana shows temperament: how you react, argue and what pace of life feels natural. The same gana means similar reactions; Deva with Rakshasa traditionally clashes.', fix: 'Gana dosha is traditionally reduced when Graha Maitri and Bhakoot are favourable or the Moon-sign lords are friends.' },
    Bhakoot: { calc: 'Counts the distance between your Moon signs. Seven points for favourable distances; 0 for 2/12, 5/9 or 6/8.', mean: 'Bhakoot (Rashi koot) shows emotional affinity, family welfare and shared prosperity — how your emotional natures sit together day to day.', fix: 'Bhakoot dosha is traditionally cancelled when both Moon signs share the same lord or the lords are friends, and is softened when Nadi and Tara are favourable.' },

  function kootaDeep(x, nG, nB) {

  /* ---------- compatibility map parts ---------- */
  const CONTACT = { 'Sun-Sun': 'shared identity and goals — you understand each other’s drive, but may compete for the spotlight', 'Sun-Moon': 'the classic marriage contact — one gives direction, the other emotional support', 'Mars-Sun': 'energy and motivation — you push each other, sometimes into competition', 'Sun-Venus': 'admiration, affection and pleasure in each other', 'Jupiter-Sun': 'encouragement, generosity and growth', 'Saturn-Sun': 'commitment and responsibility — stabilising, but it can feel heavy or controlling', 'Moon-Moon': 'emotional twins — you feel things the same way', 'Mars-Moon': 'emotional passion — feelings can flare quickly', 'Moon-Venus': 'tenderness and affection — one of the sweetest contacts', 'Jupiter-Moon': 'emotional generosity and optimism', 'Moon-Saturn': 'loyalty and stability, sometimes emotional coolness', 'Mars-Mars': 'shared energy and drive — also rivalry and quarrels', 'Mars-Venus': 'strong physical attraction and chemistry', 'Jupiter-Mars': 'shared adventures and ambition', 'Mars-Saturn': 'frustration — or disciplined teamwork when you build something together', 'Venus-Venus': 'shared taste and the same love style', 'Jupiter-Venus': 'generosity and enjoying life together', 'Saturn-Venus': 'serious, lasting love that can be reserved', 'Jupiter-Jupiter': 'shared faith and values', 'Jupiter-Saturn': 'growth balanced with structure', 'Saturn-Saturn': 'similar life lessons and timing' };

  const ELEM_DEEP = { 'fire+fire': 'Two fires: enthusiasm, passion and shared adventures — and two strong wills. Take turns leading.', 'earth+earth': 'Two earths: stability, practicality and loyalty. Add spontaneity so life stays fresh.', 'air+air': 'Two airs: endless conversation and shared ideas. Make room for feelings and practical plans.', 'water+water': 'Two waters: deep empathy; you sense each other without words. Don’t drown in moods together.', 'air+fire': 'Air feeds fire: ideas spark action and you energise each other.', 'earth+water': 'Water nourishes earth: emotional depth meets stability — a nurturing, lasting mix.', 'earth+fire': 'Fire and earth: drive meets patience. Fire may find earth slow; earth may find fire reckless. Respect each other’s pace.', 'fire+water': 'Fire and water: passion and feeling, but steam is possible — fire can hurt water, water can dampen fire. Speak gently.', 'air+water': 'Air and water: head meets heart. One analyses, the other feels; translate between logic and emotion.', 'air+earth': 'Air and earth: ideas meet practicality. Air brings new thinking, earth makes it real — if you don’t dismiss each other.' };

  function manglikDeep(k, m) {

  }

  Object.assign(JY, { SX, PX, HFX, HX, NX, KX, grahaReading, lagnaReading, rashiReading, nakReading, padaReading, houseReading, kootaDeep, contactText, elemDeep, REL_HOUSE, manglikDeep, signBlock });

/* ============================================================

    const pts = H[h].map((n) => P[n]);
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    const sign = (first + h - 1) % 12;
    g += `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" class="cell${h === 1 ? ' first' : ''}"><title>House ${h}: ${esc(signName(sign))}</title></polygon>`;
    const [nx, ny] = SN_POS[h];
    g += `<text x="${nx}" y="${ny + 4}" text-anchor="middle" class="sn">${sign + 1}</text>`;
    g += lines(byHouse[h] || [], cx, cy + 6, pts.length === 4 ? 3 : 2);
  }
  g += `<text x="200" y="${timeKnown ? 52 : 50}" text-anchor="middle" class="hl">${timeKnown ? 'Asc' : 'Moon'}</text>`;
  return `<svg class="kchart" viewBox="-2 -2 404 404" role="img" aria-label="${esc(title)}, North Indian style. House 1 is the top diamond; numbers are signs, 1 = Aries.">${g}</svg>`;
}

async function recalc(k, settings, msg) {
  const inp = inputFromDoc(k);
  try {
    const calc = await calculate(inp, settings);
    const next = buildDoc(inp, calc, k);
    const changes = diffSummary(k, next);
    const go = await new Promise((res) => openModal({
      title: 'Check the recalculated chart', label: 'Recalculated',
      body: changes.length ? `<p style="margin-top:0">These values change:</p><ul class="changes">${changes.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : `<p style="margin-top:0">Nothing that’s shown in the chart changed. Exact degrees may differ slightly.</p>`,
      foot: `<button class="btn ghost" data-no>Keep the current chart</button><button class="btn" data-ok>Save new chart</button>`,
      onMount: (m, close) => { $('[data-no]', m).onclick = () => close(false); $('[data-ok]', m).onclick = () => close(true); },
      onClose: (v) => res(!!v),
    }));
    if (!go) return;
    const { shared } = k;
    await saveKundali({ ...next, name: k.name }, shared);
    toast(msg);
  } catch (e) { console.error(e); toast(e && e.code ? errText(e) : 'Couldn’t calculate the chart. Check the birth details.', 'err'); }
}
function inputFromDoc(k) {
  const bi = k.birth_input;
  return { name: k.name, date: `${bi.y}-${pad(bi.m)}-${pad(bi.d)}`, time: bi.time || '12:00', timeKnown: bi.timeKnown, tz: k.timezone.id, choice: k.timezone.choice || 0, place: { ...k.birthplace, tzHow: k.timezone.how } };
}

/* ---------- downloads: PNG and PDF ---------- */
async function chartPng(k, style, size = 1200) {
  const svg = chartSvg(k, style, '').replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" `)
    .replace('>', `><style>${CHART_CSS}</style><rect x="-2" y="-2" width="404" height="404" fill="#FFF9FB"/>`);
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#FFF9FB'; g.fillRect(0, 0, size, size); g.drawImage(img, 0, 0, size, size);
  return c;
}
const CHART_CSS = `.cell{fill:#FFF9FB;stroke:#B83D72;stroke-width:1.5}.cell.first{fill:#FFE4EE}.sn{font:600 11px sans-serif;fill:#9A6A82}.gt{font:700 14px sans-serif;fill:#3E2A36}.hl{font:600 11px sans-serif;fill:#B83D72}.ct{font:700 16px sans-serif;fill:#3E2A36}.cs{font:12px sans-serif;fill:#6E5060}.asl{stroke:#B83D72;stroke-width:1.5}`;
function openDownload(k, style) {

    onMount: (m, close) => {
      $('[data-png]', m).onclick = async () => { try { const c = await chartPng(k, style); const b = await new Promise((r) => c.toBlob(r, 'image/png')); if (await saveFile(base + '-chart.png', b)) toast('Chart image saved'); close(); } catch (e) { console.error(e); toast('Couldn’t make the image.', 'err'); } };
      $('[data-pdf]', m).onclick = async () => { try { const b = await kundaliPdf(k, style); if (await saveFile(base + '-kundali.pdf', b)) toast('Report saved'); close(); } catch (e) { console.error(e); toast('Couldn’t make the PDF.', 'err'); } };
    },

async function kundaliPdf(k, style) {
  const c = await chartPng(k, style, 900);
  const jpg = new Uint8Array(await (await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.92))).arrayBuffer());
  const bi = k.birth_input, tz = k.timezone;
  const L = [];
  L.push(['h', `${k.name || nameOf(k.seat)} - Kundali`]);

function makePdf(lines, jpg, iw, ih) {

  const need = (h) => { if (y - h < M) { pages.push(cur); cur = []; y = H - M; } };

    if (t === 'img') { const w = 300, h = (ih / iw) * w; need(h + 24); cur.push(`q ${w} 0 0 ${h} ${(W - w) / 2} ${y - h - 10} cm /Im1 Do Q`); y -= h + 22; continue; }

    const maxChars = font === 'F3' ? 110 : Math.floor((W - 2 * M) / (size * 0.5));
    const words = String(s).split(' '); const rows = []; let row = '';
    for (const w of words) { if ((row + ' ' + w).trim().length > maxChars) { rows.push(row); row = w; } else row = (row + ' ' + w).trim(); }
    rows.push(row);
    for (const r of rows) { need(lead); y -= lead; cur.push(`BT /${font} ${size} Tf ${M} ${y} Td (${enc(r)}) Tj ET`); }
  }
  pages.push(cur);
  const objs = [];
  const add = (s) => { objs.push(s); return objs.length; };
  const catalog = add(''), pagesId = add('');
  const f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const f3 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>');
  const im = add({ img: true });
  const kids = [];
  for (const p of pages) {
    const content = p.join('\n');
    const cid = add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R /F3 ${f3} 0 R >> /XObject << /Im1 ${im} 0 R >> >> /Contents ${cid} 0 R >>`));
  }
  objs[catalog - 1] = `<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  objs[pagesId - 1] = `<< /Type /Pages /Kids [${kids.map((k) => k + ' 0 R').join(' ')}] /Count ${kids.length} >>`;
  const te = new TextEncoder();
  const latin1 = (s) => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
  const parts = [latin1('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')]; let off = parts[0].length; const xref = [];
  objs.forEach((o, i) => {
    xref.push(off);
    let chunk;
    if (o && o.img) {
      const head = latin1(`${i + 1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);

  parts.push(latin1(x));
  void te;

}

function editEvent(ev, scope) {

  openModal({

      <div class="row"><label class="field"><span>Date</span><input name="date" type="date" required value="${esc(e.date || '')}"></label>
      <label class="field"><span>Time (optional)</span><input name="time" type="time" value="${esc(e.time || '')}"></label></div>
      <label class="field"><span>Where</span><input name="location" maxlength="160" value="${esc(e.location || '')}" placeholder="Place, city"></label>
      <label class="field"><span>Story</span><textarea name="description" maxlength="5000">${esc(e.description || '')}</textarea></label>
      <label class="field"><span>Tags</span><input name="tags" maxlength="200" value="${esc((e.tags || []).join(', '))}" placeholder="travel, family, firsts"></label>

      <div class="field"><span>Photos or documents</span><div id="attl" class="hint"></div>${S.st.assets ? `<input type="file" name="files" multiple accept="image/*,application/pdf">` : '<p class="hint">Ask for Editor access to attach files.</p>'}</div>
    </form>`,
    foot: `${ev ? `<button class="btn ghost left" data-del>${icon('trash')}Delete</button>` : ''}<button class="btn ghost" data-x2>Cancel</button><button class="btn" data-s>${ev ? 'Save changes' : 'Add moment'}</button>`,
    onMount: (m, close) => {
      const f = $('#ef', m);
      const drawAtt = () => {
        $('#attl', m).innerHTML = att.map((a, i) => `<span style="display:inline-flex;align-items:center;gap:4px;margin-right:8px">${esc(a.name)}<button type="button" class="icon-btn" style="width:32px;height:32px" data-ra="${i}" aria-label="Remove ${esc(a.name)}">${icon('close')}</button></span>`).join('');
        $$('[data-ra]', m).forEach((b) => (b.onclick = () => { att.splice(Number(b.dataset.ra), 1); drawAtt(); }));
      };
      drawAtt();
      $('[data-x2]', m).onclick = () => close();
      $('[data-s]', m).onclick = async () => {
        if (!f.reportValidity()) return;
        const btn = $('[data-s]', m); btn.disabled = true; btn.textContent = 'Saving…';
        try {
          for (const file of f.files ? [...f.files.files] : []) {
            let blob = file, type = file.type;
            if (type !== 'application/pdf') { const x = await prepPhoto(file); blob = x.full; type = blob.type || 'image/jpeg'; }
            const up = await upload(blob, type);
            att.push({ id: up.id, name: file.name, type });
          }
          const body = { title: f.title.value.trim(), date: f.date.value, time: f.time.value, location: f.location.value.trim(), description: f.description.value.trim(), tags: f.tags.value.split(',').map((t) => t.trim()).filter(Boolean).slice(0, 12), scope: f.scope.value, att };
          if (ev) await retryOnce(() => S.st.db.doc('events/' + ev.id).update({ ...body, editedSeat: S.me.seat, editedAt: Date.now() }));
          else await retryOnce(() => S.st.db.collection('events').doc(uid()).set({ ...body, seat: S.me.seat, at: Date.now() }));
          toast(ev ? 'Moment saved' : 'Moment added'); close();
        } catch (er) { toast(er && er.code === 'decode' ? er.message : errText(er), 'err'); btn.disabled = false; btn.textContent = 'Try again'; }
      };
      const d = $('[data-del]', m);
      if (d) d.onclick = async () => {
        if (!(await confirmBox(`Delete “${e.title}” from the timeline?`, 'Delete moment'))) return;
        try { await S.st.db.doc('events/' + ev.id).delete(); toast('Moment deleted'); close(); } catch (er) { toast(errText(er), 'err'); }
      };
    },
  });
}

/* ============================================================
   Kundlis: explained positions, compatibility (Guna Milan),
   and day / week / month / year forecasts from transits.
   All of it is computed from the saved charts with classical
   Jyotish rules. It is traditional interpretation, not science.

const FC = (() => {
  const B = () => Astro.builtin;
  const KEYS7 = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'];
  const DAY = 86400000;
  function lons(ms, st = {}) {
    const jd = Astro.jdFromMs(ms), jdTT = jd + Astro.deltaT(new Date(ms).getUTCFullYear()) / 86400;
    const T = (jdTT - 2451545) / 36525, ay = Astro.ayanamsa(jdTT, st.ayanamsa || 'lahiri');

  },

const NV = (() => {
  const DAY = W.DAY;

  const noon = (ms) => { const d = new Date(ms); d.setHours(12, 0, 0, 0); return d.getTime(); };
  const DAY_COLOR = ['orange or gold (Sun)', 'white or silver (Moon)', 'red (Mars)', 'green or yellow (Mercury)', 'blue or purple (Jupiter)', 'pink or pastel green (Venus)', 'black or dark blue (Saturn)'];
  const personal = (ch) => W.all(ch).filter((b) => !['Fortune', 'Lilith', 'Node'].includes(b.key));

  /* ---------- transits for a day ---------- */
  const T_ORB = { Moon: 6, Sun: 2.5, Mercury: 2, Venus: 2, Mars: 2, Jupiter: 2, Saturn: 2, Uranus: 1.5, Neptune: 1.5, Pluto: 1.5 };
  const T_W = { Moon: 5, Sun: 4, Mercury: 3, Venus: 5, Mars: 4, Jupiter: 5, Saturn: 5, Uranus: 3, Neptune: 3, Pluto: 3 };
  const BENEFIC = ['Venus', 'Jupiter', 'Sun', 'Moon', 'Mercury'];
  function transitHits(ch, L, keys = W.PLANETS, targets = personal(ch)) {
    const out = [];
    for (const k of keys) for (const t of targets) {
      const d = Astro.angDiff(L[k], t.lon);
      for (const asp of W.ASPECTS.filter((a) => !a.minor || a.key === 'quincunx')) {
        const lim = T_ORB[k] * (asp.key === 'quincunx' ? 0.5 : 1);
        const orb = Math.abs(d - asp.a);
        if (orb <= lim) { out.push({ a: k, b: t.key, type: asp.key, orb, lim }); break; }
      }
    }
    return out;
  }
  const hitVal = (h) => { const kind = W.ASP[h.type].kind; const v = kind === 'soft' ? 1 : kind === 'hard' ? -1 : kind === 'conj' ? (BENEFIC.includes(h.a) ? 0.8 : -0.6) : -0.4; return v * T_W[h.a] * (['Sun', 'Moon', 'ASC'].includes(h.b) ? 1.2 : 1) * (0.4 + 0.6 * (1 - h.orb / h.lim)); };
  function day(ch, ms, st) {
    const L = W.lons(ms, st, Astro.builtin), Lb = W.lons(ms - DAY / 4, st, Astro.builtin);
    const moonSign = Math.floor(L.Moon / 30);
    const moonHouse = ch.cusps ? W.houseOf(L.Moon, ch.cusps) : ((moonSign - W.get(ch, 'Sun').sign + 12) % 12) + 1;
    const phaseAng = Astro.norm(L.Moon - L.Sun);
    const hits = transitHits(ch, L).sort((a, b) => Math.abs(hitVal(b)) - Math.abs(hitVal(a)));
    const mercR = W.signedTo(Lb.Mercury, L.Mercury) < 0;
    let score = 50 + hits.reduce((s, h) => s + hitVal(h), 0) * 1.6 - (mercR ? 3 : 0);
    score = Math.max(8, Math.min(96, Math.round(score)));
    return { ms, L, moonSign, moonHouse, phaseAng, phase: W.phaseName(phaseAng), hits, score, mercR };
  }
  function yearScore(ch, ms, st) {
    const L = W.lons(ms, st, Astro.builtin);
    const hs = transitHits(ch, L, ['Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'], personal(ch)).map((h) => ({ ...h, lim: h.lim + 2, orb: Math.max(0, h.orb) }));
    const extra = transitHits(ch, L, ['Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto'], personal(ch).filter((b) => ['Sun', 'Moon', 'Venus', 'ASC', 'MC'].includes(b.key)));

  function retrogrades(ms, st) {

    return RETRO_KEYS.filter((k) => W.signedTo(a[k], b[k]) < 0);

  const RETRO_TXT = { Mercury: 'review, rethink and double-check plans, messages and travel', Venus: 'revisit old loves and values; delay big purchases and makeovers', Mars: 'redirect energy inward; avoid starting fights or risky projects', Jupiter: 'inner growth over outer expansion', Saturn: 'review commitments and structures', Uranus: 'inner freedom; quiet rebellion', Neptune: 'clearer sight — illusions fade', Pluto: 'inner transformation' };
  const hitLi = (h, nm) => `<li class="${W.ASP[h.type].kind === 'soft' ? 'ok' : W.ASP[h.type].kind === 'hard' ? 'no' : ''}"><b>${ab(h.a)} ${W.NAME[h.a]} ${W.ASP[h.type].name} ${nm ? nm + '’s' : 'your'} ${W.NAME[h.b]}</b>${h.at ? ` <small class="muted">${fmtD(h.at)}</small>` : ''}<br><small>${WK.transitGlance(h)} ${WK.cap(WK.transitAdvice(h))}.</small></li>`;

  /* ---------- couple day ---------- */
  const COUPLE_PLAN = ['do something new together', 'a good dinner or a small treat', 'a long talk or a short trip', 'a cosy evening at home', 'a date — romance and fun are favoured', 'sort out practical things together', 'quality time as a couple; talk about plans', 'a deep, honest talk — gently', 'plan a trip or learn something together', 'back each other’s work goals', 'see friends together', 'rest together and have an early night'];
  function coupleDay(cA, cB, comp, ms, nA, nB) {
    const a = day(cA, ms, cA.settings), b = day(cB, ms, cB.settings);
    const L = a.L;
    const ch = transitHits(comp, L, ['Moon', 'Sun', 'Venus', 'Mars', 'Jupiter', 'Saturn'], W.all(comp).filter((x) => ['Sun', 'Moon', 'Venus', 'Mars', 'ASC'].includes(x.key)));
    const compHouse = comp.cusps ? W.houseOf(L.Moon, comp.cusps) : null;
    let score = (a.score + b.score) / 2 + ch.reduce((s, h) => s + hitVal(h), 0) * 1.2;
    score = Math.max(8, Math.min(96, Math.round(score)));
    const touch = [];
    for (const [c, n] of [[cA, nA], [cB, nB]]) for (const k of ['Sun', 'Moon', 'Venus', 'Mars']) { const p = W.get(c, k); if (Astro.angDiff(L.Moon, p.lon) < 8) touch.push({ who: n, key: k }); }
    return { ms, a, b, score, comp: ch, compHouse, touch, plan: COUPLE_PLAN[(compHouse || a.moonHouse) - 1] };
  }
  const MOON_OVER = { Sun: 'attention and warmth flow towards them', Moon: 'their feelings are close to the surface — be gentle', Venus: 'affection and attraction run high', Mars: 'desire and energy — and a quicker temper' };

  /* ---------- view ---------- */
  const WV = {
    get tab() { return VIEWS.kundlis.tab; },

    timelineHtml(s) { return VIEWS.kundlis.timelineHtml(s); },
    psub: 'chart', csub: 'overview', fc: 'today', selB: '', synBase: 'A', cache: {},
    render(box) {

      const full = k && !k.stub;

      if (k && k.stub) return `<div class="empty">${icon('lock', 'spark')}<strong>${esc(nameOf(seat))} keeps their chart private</strong>They can choose to share it from their own profile.</div>`;
      return `<div class="empty">${icon('star', 'spark')}<strong>${S.members[seat] ? esc(nameOf(seat)) + ' hasn’t created a chart yet' : 'Waiting for the second person to join'}</strong></div>`;
    },

      <section class="kgrid2">
        <div class="panel"><div class="ph"><h3>Aspect grid</h3></div>${WHEEL.grid(W.BODIES.concat(tk ? ['ASC', 'MC'] : []), W.BODIES.concat(tk ? ['ASC', 'MC'] : []), ch.aspects)}
          <p class="legend">☌ conjunction · ⚹ sextile · □ square · △ trine · ☍ opposition · ⚻ quincunx — the small number is the orb in degrees.</p></div>

      <section class="panel settings-p"><div class="ph"><h3>How this was calculated</h3><button class="btn ghost sm" data-wlearn>Learn more</button></div>
        <p class="muted" style="margin-top:0">Tropical zodiac · ${esc({ placidus: 'Placidus', whole: 'Whole-sign', equal: 'Equal', porphyry: 'Porphyry' }[st.houses])} houses · ${st.node === 'mean' ? 'mean' : 'true'} lunar node · mean Black Moon Lilith · ${esc(W.engineName())}.<br>Birth instant ${esc(k.utc_birth_instant.replace('T', ' ').slice(0, 16))} UTC · ${esc(k.birthplace.lat.toFixed(4))}°, ${esc(k.birthplace.lon.toFixed(4))}°.</p>
        ${own ? `<details class="adv"><summary>Advanced settings</summary><div class="row" style="margin-top:12px">
          <label class="field"><span>House system</span><select id="wHo">${[['placidus', 'Placidus — default'], ['whole', 'Whole sign'], ['equal', 'Equal'], ['porphyry', 'Porphyry']].map(([v, l]) => `<option value="${v}" ${v === st.houses ? 'selected' : ''}>${l}</option>`).join('')}</select></label>

          <div class="advice"><div class="ok"><b>Do</b><ul>${[...new Set(doL)].map((x) => `<li>${esc(WK.cap(x))}</li>`).join('')}</ul></div><div class="no"><b>Avoid</b><ul>${[...new Set(avoidL)].map((x) => `<li>${esc(WK.cap(x))}</li>`).join('')}</ul></div></div>

            <div class="chartwrap wheelwrap">${WHEEL.svg({ base: ch, inner: ch.bodies.filter((b) => W.PLANETS.includes(b.key)), outer: sky.bodies.filter((b) => W.PLANETS.includes(b.key)), aspects: d.hits.map((h) => ({ a: h.b, b: h.a, type: h.type, orb: h.orb, lim: h.lim, outer: true })).filter((x) => W.PLANETS.includes(x.a)), outerColor: '#FFB547', label: 'Transits around the natal chart' })}</div>
