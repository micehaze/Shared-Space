  --font: 'Vice Sans', Tahoma, Verdana, 'DejaVu Sans', Geneva, sans-serif;
  --script: 'Mr Dafoe', 'Brush Script MT', cursive;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --nav-h: 50px;
  /* names kept for older screens */
  --bg: var(--night); --card: var(--glass); --tint: rgba(255, 62, 165, .16); --rose: var(--pink); --rasp: #FF7CC0;
  --plum: var(--text); --plum-soft: var(--dim); --line-strong: rgba(185, 171, 223, .45); --ok: #7CF0B0;
  --frost: var(--text); --ink: var(--text); --text-dim: var(--dim); --night-2: var(--glass); --night-3: var(--glass-2);
  --gold: var(--amber); --neon: var(--pink); --mist: #FFB3DA; --rouge: #FF8CC6; --blue: #9FD8FF; --beige: #FFE3B8;
  --shadow: 3px 3px 0 rgba(0, 0, 0, .45); --shadow-lg: 6px 6px 0 rgba(0, 0, 0, .5);
}
*, *::before, *::after { box-sizing: border-box; border-radius: var(--r) !important; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 13px; line-height: 1.5; color: var(--text); background: var(--night); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cyan); }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 1px dotted #fff; outline-offset: 2px; box-shadow: 0 0 0 2px var(--pink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--dim); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
::selection { background: var(--pink); color: #fff; }

/* backdrop */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #060823; overflow: hidden; contain: strict; }
.scene-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }
.scene::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .12) 0 1px, transparent 1px 3px); opacity: .35; }

/* ---------- shell ---------- */
.app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.app > .main { flex: 1; }
.demo-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 10px; padding-left: calc(10px + var(--safe-l)); background: linear-gradient(180deg, #2A1E62, #150E3A); color: var(--dim); font-size: 11px; font-weight: 700; border-bottom: 1px solid #000; box-shadow: inset 0 1px 0 var(--hi); }
.demo-bar .sw { display: inline-flex; gap: 2px; }
.demo-bar .sw button { padding: 1px 10px; min-height: 22px; cursor: pointer; font-weight: 700; font-size: 11px; color: var(--text); background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.demo-bar .sw button[aria-pressed="true"] { background: var(--gel); color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .4); border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.demo-bar .db-note { margin-left: auto; font-weight: 400; }
.sky { position: relative; display: flex; align-items: center; gap: 10px; padding: calc(6px + var(--safe-t)) calc(10px + var(--safe-r)) 6px calc(10px + var(--safe-l)); background: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 50%), var(--title); border-bottom: 1px solid #000; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.sky .palm { display: none; }
.sky .title-wrap { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.wordmark { font-family: var(--script); font-weight: 400; line-height: 1; color: #FFE4F3; text-shadow: 0 0 6px #FF3EA5, 0 0 14px #FF3EA5, 2px 2px 0 #3A0B4E; }
.sky .wordmark { font-size: 28px; }
.sky .where { font-size: 12px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side { display: none; }
.main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.view { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px calc(8px + var(--safe-r)) 16px calc(8px + var(--safe-l)); }
.view.flush { padding: 6px; overflow: hidden; display: flex; flex-direction: column; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 4px 4px calc(4px + var(--safe-b)); padding-left: calc(4px + var(--safe-l)); padding-right: calc(4px + var(--safe-r)); background: linear-gradient(180deg, #3B2E80 0%, #1C1450 100%); border-top: 1px solid #9C8CFF; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
.tabs a, .tabs button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 40px; text-decoration: none; color: var(--text); font-size: 10px; font-weight: 700; background: var(--metal); cursor: pointer; border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.tabs svg { width: 17px; height: 17px; }
.tabs [aria-current="page"] { background: linear-gradient(180deg, #1A1040, #2C1E66); border-color: var(--lo) var(--hi) var(--hi) var(--lo); color: #FFB3DA; box-shadow: inset 0 0 8px rgba(255, 62, 165, .35); }
.badge { position: absolute; top: 2px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; font-size: 10px; font-weight: 700; line-height: 14px; text-align: center; background: #FF2E5E; color: #fff; border: 1px solid #fff; box-shadow: 0 0 6px #FF2E5E; }
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr; }
  .app.has-demo { grid-template-rows: auto 1fr; }
  .demo-bar { grid-column: 1 / -1; }
  .sky, .tabs { display: none; }
  .side { display: flex; flex-direction: column; position: relative; margin: 10px 0 10px 10px; background: var(--glass); border: 1px solid; border-color: var(--raised); box-shadow: 4px 4px 0 rgba(0, 0, 0, .5); overflow: hidden; }
  .side::before { content: 'Start'; display: block; padding: 3px 8px; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(180deg, rgba(255, 255, 255, .2), transparent 55%), var(--title); text-shadow: 1px 1px 0 rgba(0, 0, 0, .5); }
  .side .wordmark { font-size: 40px; padding: 14px 12px 2px; display: block; }
  .side .tag { padding: 2px 14px 10px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .side nav { display: flex; flex-direction: column; gap: 1px; padding: 0 6px; }
  .side nav a { position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 8px; text-decoration: none; color: var(--text); font-size: 12px; font-weight: 700; border: 1px solid transparent; }
  .side nav a svg { width: 16px; height: 16px; color: var(--pink); }
  .side nav a:hover { background: linear-gradient(90deg, rgba(255, 62, 165, .35), rgba(123, 60, 255, .2)); border-color: rgba(255, 255, 255, .15); }
  .side nav a[aria-current="page"] { background: var(--title); color: #fff; border-color: var(--hi) var(--lo) var(--lo) var(--hi); text-shadow: 1px 1px 0 rgba(0, 0, 0, .4); }
  .side nav a[aria-current="page"] svg { color: #fff; }
  .side nav .badge { position: static; margin-left: auto; }
  .view { padding: 10px 14px 18px; }
  .view.flush { padding: 10px; }
}
.side .skyline { display: none; }

/* ---------- window chrome ---------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; padding: 3px 4px 3px 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .2), transparent 55%), var(--title); border: 1px solid; border-color: #FFA3D6 #1A0F3A #1A0F3A #FFA3D6; box-shadow: 3px 3px 0 rgba(0, 0, 0, .45); }
.page-head > div:first-child { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.page-head h1 { margin: 0; }
.page-head .sub { display: none; }
.page-head > .row:empty { display: none; }
.page-head::after { content: '_  □  ×'; font: 700 11px/1 var(--font); color: #2A0B3A; background: linear-gradient(180deg, #F3E8FF, #C9B6F2); padding: 2px 6px; border: 1px solid; border-color: #fff #3A2A6A #3A2A6A #fff; letter-spacing: 1px; white-space: pre; }
.h-script { font: 700 13px/1.3 var(--font); color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .5); margin: 0; }
@media (max-width: 899px) { .page-head { display: none; } }
.sub { color: var(--dim); margin: 4px 0 0; font-size: 12px; }
h2.sec { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin: 16px 0 6px; color: #FFB3DA; }
h2.sec::before { content: ''; width: 8px; height: 8px; background: var(--pink); box-shadow: 0 0 6px var(--pink); flex: none; }
h3 { font-size: 13px; margin: 0 0 4px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 28px; padding: 0 12px; cursor: pointer; text-decoration: none; font-weight: 700; font-size: 12px; white-space: nowrap; color: #fff; text-shadow: 0 1px 0 rgba(80, 0, 40, .5); background: var(--gel); border: 1px solid #7A0A45; box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .55), inset -1px -1px 0 rgba(0, 0, 0, .25), 2px 2px 0 rgba(0, 0, 0, .45); }
.btn:hover { background: var(--gel-hi); }
.btn:active { box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .5); transform: translate(1px, 1px); }
.btn svg { width: 14px; height: 14px; }
.btn.ghost, .btn.pink, .btn.blue { color: var(--text); background: var(--metal); border-color: #120A30; text-shadow: none; box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .3), inset -1px -1px 0 rgba(0, 0, 0, .3), 2px 2px 0 rgba(0, 0, 0, .45); }
.btn.ghost:hover, .btn.pink:hover, .btn.blue:hover { background: linear-gradient(180deg, #6D5AB6 0%, #4A3A92 48%, #382A7A 52%, #4B3C96 100%); }
.btn.danger { background: linear-gradient(180deg, #FF8A8A 0%, #E0303A 48%, #B3141E 52%, #D62A35 100%); border-color: #5A0008; color: #fff; }
.btn.sm { min-height: 24px; padding: 0 9px; font-size: 11px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; background: transparent; border: 1px solid transparent; color: var(--text); cursor: pointer; }
.icon-btn:hover { background: var(--metal); border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.icon-btn svg { width: 16px; height: 16px; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.field > span, .lbl { font-size: 11px; font-weight: 700; color: var(--dim); }
.input, .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea, select.input, textarea.input { width: 100%; min-height: 30px; padding: 4px 8px; background: var(--paper); color: var(--paper-ink); font-size: 13px; border: 1px solid; border-color: var(--sunken); box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .35); }
.field textarea, textarea.input { min-height: 70px; resize: vertical; line-height: 1.45; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { outline: none; box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .35), 0 0 0 2px var(--pink); }
input[type=date], input[type=time] { color-scheme: light; }
input[type=file] { font-size: 12px; color: var(--text); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .field { flex: 1 1 140px; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 700; font-size: 12px; min-height: 28px; }
.check input { width: 15px; height: 15px; accent-color: var(--pink); }
.hint { font-size: 11px; color: var(--dim); margin: 3px 0 0; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; padding: 5px; background: var(--glass); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.toolbar .grow, .grow { flex: 1 1 160px; }
.search { position: relative; }
.search svg { position: absolute; left: 8px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: #6A5A9A; pointer-events: none; z-index: 1; }
.search .input { padding-left: 28px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { min-height: 24px; padding: 0 10px; cursor: pointer; font-weight: 700; font-size: 11px; color: var(--text); background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.chip[aria-pressed="true"] { background: var(--gel); color: #fff; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.seg { display: inline-flex; gap: 2px; }
.seg button { min-height: 26px; padding: 0 10px; color: var(--text); font-weight: 700; font-size: 11px; cursor: pointer; background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.seg.sm button { min-height: 22px; padding: 0 8px; font-size: 10px; }
.seg button[aria-pressed="true"] { background: var(--gel); color: #fff; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.empty { padding: 18px 14px; text-align: center; color: var(--dim); background: var(--glass); border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); font-size: 12px; }
.empty .spark { width: 22px; height: 22px; color: var(--pink); margin: 0 auto 6px; display: block; filter: drop-shadow(0 0 6px var(--pink)); }
.empty strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 2px; }
.empty .btn { margin-top: 10px; }
.banner { padding: 6px 10px; background: rgba(255, 181, 71, .12); border: 1px solid rgba(255, 181, 71, .55); color: #FFE2B5; margin-bottom: 8px; font-size: 12px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.banner > svg, .reminder > svg { width: 15px; height: 15px; flex: none; color: var(--amber); margin-top: 1px; }
.banner > span { flex: 1 1 200px; }
.banner.warn { background: rgba(255, 62, 94, .14); border-color: rgba(255, 110, 140, .6); color: #FFD0DA; }
.pill { display: inline-block; padding: 0 6px; font-size: 10px; font-weight: 700; border: 1px solid currentColor; }
.pill.priv { color: var(--amber); } .pill.cat { color: var(--cyan); }

/* ---------- inbox: an MSN-style chat window ---------- */
.inbox { display: grid; grid-template-columns: minmax(0, 1fr); height: 100%; min-height: 0; }
.inbox-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; position: relative; background: var(--glass); border: 1px solid; border-color: var(--raised); box-shadow: 3px 3px 0 rgba(0, 0, 0, .45); }
.inbox-bar { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; background: linear-gradient(180deg, rgba(255, 255, 255, .2), transparent 55%), var(--title); border-bottom: 1px solid #000; color: #fff; }
.ib-title { display: none; margin-right: auto; }
.ib-title .h-script { font-size: 13px; }
.ib-title .sub { display: none; }
.inbox-bar .next { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #fff; text-decoration: none; text-shadow: 1px 1px 0 rgba(0, 0, 0, .4); }
.inbox-bar .next b { color: #FFF3A6; }
.inbox-bar .next span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox-bar .next svg { flex: none; width: 13px; height: 13px; }
.inbox-bar .icon-btn { width: 24px; height: 22px; color: #2A0B3A; background: linear-gradient(180deg, #F3E8FF, #C9B6F2); border: 1px solid; border-color: #fff #3A2A6A #3A2A6A #fff; }
.inbox-bar .icon-btn svg { width: 13px; height: 13px; }
#remBox .reminders { padding: 4px 4px 0 !important; }
.thread { flex: 1; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; position: relative; margin: 4px; padding: 6px 10px 10px; background: var(--paper); color: var(--paper-ink); border: 1px solid; border-color: var(--sunken); box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .3); }
.thread .empty { background: #F7F2FF; color: #5A4A7A; border-color: #C8B8EA; }
.thread .empty strong { color: var(--paper-ink); }
.thread .banner { color: #6B3A00; }
.reminders { display: flex; flex-direction: column; gap: 4px; }
.reminder { display: flex; gap: 8px; align-items: center; padding: 3px 4px 3px 8px; background: linear-gradient(180deg, #FFF6D6, #FFE08A); color: #3A2500; font-weight: 700; font-size: 12px; border: 1px solid #B98A1F; }
.reminder > svg { color: #A35D00; }
.reminder small { display: block; font-weight: 400; color: #6B4A10; font-size: 11px; }
.reminder .icon-btn { width: 22px; height: 22px; color: #3A2500; }
.day-sep { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; color: #7A6AA6; font-size: 10px; font-weight: 700; }
.day-sep::before, .day-sep::after { content: ''; flex: 1; height: 1px; background: #DCD2F2; }
.new-sep { display: flex; align-items: center; gap: 6px; margin: 8px 0; color: #D4136F; font-size: 11px; font-weight: 700; }
.new-sep::after { content: ''; flex: 1; border-top: 1px dashed #D4136F; }
.msg { display: flex; flex-direction: column; max-width: 100%; margin: 0; }
.msg.mine { margin-left: 0; align-items: stretch; }
.msg .meta { font-size: 11px; color: #6A5A9A; margin: 6px 0 1px; display: flex; gap: 6px; align-items: center; }
.msg .meta b { color: #D4136F; }
.msg.theirs .meta b { color: #1A57C9; }
.msg .meta b::after { content: ' says:'; font-weight: 400; color: #6A5A9A; }
.msg .meta time { margin-left: auto; font-size: 10px; }
.bubble { position: relative; padding: 0 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.45; color: var(--paper-ink); background: none; border: 0; box-shadow: none; }
.msg.mine .bubble { color: #3A0D2A; }
.msg.deleted .bubble { color: #8A7AAA; font-style: italic; }
.msg.pending .bubble { opacity: .6; }
.msg.failed .bubble { color: #B8102C; }
.msg .state { font-size: 10px; margin: 1px 0 0 12px; display: flex; gap: 6px; align-items: center; color: #7A6AA6; }
.msg .state svg { width: 11px; height: 11px; color: #D4136F; }
.msg .state.fail { color: #B8102C; font-weight: 700; }
.msg .state button { background: none; border: 0; padding: 2px; color: #1A57C9; font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 10px; }
.msg .more { opacity: .55; background: none; border: 0; color: #6A5A9A; cursor: pointer; padding: 0 2px; }
.msg .more svg { width: 12px; height: 12px; }
.msg:hover .more { opacity: 1; }
.msg.flash .bubble { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: #FFE08A; } 100% { background: transparent; } }
.older { display: flex; justify-content: center; margin-bottom: 6px; }
.composer { background: transparent; padding: 0 4px 4px; border: 0; }
.composer .box { display: flex; gap: 4px; align-items: stretch; }
.composer textarea { flex: 1; min-height: 52px; max-height: 34vh; resize: none; padding: 6px 8px; background: var(--paper); color: var(--paper-ink); font-size: 13px; line-height: 1.4; border: 1px solid; border-color: var(--sunken); box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .3); }
.composer textarea:focus { outline: none; box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .3), 0 0 0 2px var(--pink); }
.composer .btn { min-height: 52px; padding: 0 12px; }
.composer .status { font-size: 10px; color: var(--dim); margin-top: 3px; min-height: 14px; display: flex; justify-content: space-between; gap: 8px; }
.composer .status .ok { color: var(--ok); font-weight: 700; }
.rail { display: none; }
@media (min-width: 1200px) {
  .inbox { grid-template-columns: minmax(0, 1fr) 260px; gap: 10px; }
  .rail { display: block; overflow-y: auto; background: var(--glass); border: 1px solid; border-color: var(--raised); padding: 0 10px 10px; box-shadow: 3px 3px 0 rgba(0, 0, 0, .45); }
  .rail h2.sec:first-child { margin: 0 -10px 8px; padding: 3px 8px; color: #fff; background: linear-gradient(180deg, rgba(255, 255, 255, .2), transparent 55%), var(--title); }
  .rail h2.sec:first-child::before { display: none; }
  .inbox-bar .next { display: none; }
}
@media (min-width: 900px) { .ib-title { display: block !important; } }
.up-list { display: flex; flex-direction: column; gap: 6px; }
.up { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; cursor: pointer; padding: 0; background: transparent; border: 0; text-align: left; color: inherit; width: 100%; }
.cal { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 42px; height: 42px; background: var(--paper); color: var(--paper-ink); border: 1px solid #3A2A6A; line-height: 1; box-shadow: 2px 2px 0 rgba(0, 0, 0, .45); overflow: hidden; }
.cal::before { content: ''; align-self: stretch; height: 6px; flex: none; background: var(--title); }
.cal b { font-size: 15px; font-weight: 700; margin-top: 3px; }
.cal small { font-size: 9px; font-weight: 700; color: #D4136F; margin-top: 1px; }
.up .t { font-weight: 700; font-size: 12px; }
.up .s { font-size: 11px; color: var(--dim); }
.up .soon { color: var(--amber); font-weight: 700; }

/* ---------- gallery ---------- */

.tile .cap { position: absolute; left: 3px; right: 3px; bottom: 3px; padding: 10px 4px 2px; font-size: 10px; font-weight: 700; text-align: left; background: linear-gradient(180deg, transparent, rgba(10, 4, 30, .8)); color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer { position: fixed; inset: 0; z-index: 60; background: rgba(6, 4, 22, .96); display: flex; flex-direction: column; }
.viewer .vtop { display: flex; justify-content: space-between; align-items: center; padding: calc(3px + var(--safe-t)) calc(4px + var(--safe-r)) 3px calc(8px + var(--safe-l)); color: #fff; gap: 6px; font-weight: 700; font-size: 12px; background: linear-gradient(180deg, rgba(255, 255, 255, .2), transparent 55%), var(--title); }

.viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff; background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }

/* ---------- list rows (Explorer details view) ---------- */

.rowi .ic { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; background: linear-gradient(180deg, #F3E8FF, #D9C8FF); color: #4A2A9A; border: 1px solid #8A72D0; }

/* ---------- notepad ---------- */

.note-card { display: grid; grid-template-columns: 1fr; width: 100%; text-align: left; cursor: pointer; margin-bottom: 6px; padding: 7px 9px; background: linear-gradient(180deg, #FFFBE0, #FFF1A6); color: #3A2A00; border: 1px solid #B9A23A; box-shadow: 2px 2px 0 rgba(0, 0, 0, .45); position: relative; }

.swatches { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; margin: 0 0 4px; padding: 3px 5px; background: var(--glass); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }

.sw-c { width: 26px; height: 24px; padding: 0; cursor: pointer; font: 700 13px/1 var(--font); color: var(--c); background: #fff; border: 1px solid; border-color: #fff #3A2A6A #3A2A6A #fff; box-shadow: inset 0 -4px 0 var(--c); }

.ed-body { width: 100%; min-height: 200px; background: var(--paper); color: var(--paper-ink); padding: 8px 10px; font-size: 13px; line-height: 1.55; border: 1px solid; border-color: var(--sunken); box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .3); overflow-wrap: anywhere; }
.ed-body:focus { outline: none; box-shadow: inset 1px 1px 0 rgba(0, 0, 0, .3), 0 0 0 2px var(--pink); }
.rich:empty::before { content: attr(data-ph); color: #9A8ABA; }

.house .hn { flex: none; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: var(--gel); color: #fff; font-weight: 700; font-size: 11px; border: 1px solid #7A0A45; }
.house .muted { color: #6A5A9A; }
.house .hp { font-size: 11px; color: #D4136F; font-weight: 700; }
.dashas { display: flex; flex-direction: column; background: var(--paper); color: var(--paper-ink); border: 1px solid; border-color: var(--sunken); }
.dasha { border-bottom: 1px solid #EEE8FA; }
.dasha:last-child { border-bottom: 0; }
.dasha summary { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 5px 8px; cursor: pointer; list-style: none; font-size: 12px; }
.dasha summary::-webkit-details-marker { display: none; }
.dasha summary::before { content: '+'; width: 11px; height: 11px; font-size: 10px; line-height: 9px; text-align: center; color: #000; border: 1px solid #6A5A9A; background: #fff; margin-top: 2px; }
.dasha[open] summary::before { content: '−'; }
.dasha .dz-l { font-weight: 700; flex: 1; }
.dasha .dz-d { color: #6A5A9A; font-size: 11px; }
.dasha .muted { color: #8A7AAA; }
.dasha.cur { background: linear-gradient(90deg, #FFD6EC, #EADDFF); }
.now { display: inline-block; font-size: 9px; font-weight: 700; padding: 0 5px; background: var(--gel); color: #fff; margin-left: 4px; vertical-align: 1px; border: 1px solid #7A0A45; }
.subs { list-style: none; margin: 0; padding: 0 8px 6px 28px; font-size: 11px; }
.subs li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-bottom: 1px dotted #DCD2F2; flex-wrap: wrap; }
.subs li.cur { color: #D4136F; font-weight: 700; }
.adv { margin-top: 8px; font-size: 12px; }
.adv summary { cursor: pointer; font-weight: 700; color: var(--cyan); }
.refs { display: flex; flex-direction: column; gap: 6px; }
.ref { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.ref img { max-height: 120px; border: 2px solid #fff; cursor: pointer; }
.ref a svg { width: 13px; height: 13px; vertical-align: -2px; }
.changes { margin: 3px 0 10px; padding-left: 18px; font-size: 12px; } .changes li { margin-bottom: 2px; }
.learn h4 { margin: 12px 0 3px; color: #FFB3DA; font-size: 12px; }
.learn p { margin: 0 0 6px; max-width: 68ch; font-size: 12px; }

/* wizard */
.steps { display: flex; gap: 2px; list-style: none; padding: 0; margin: 0 0 10px; counter-reset: s; flex-wrap: wrap; }
.steps li { counter-increment: s; flex: 1 1 90px; font-size: 10px; font-weight: 700; color: var(--dim); padding: 3px 6px; background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.steps li::before { content: counter(s) '. '; }
.steps li.on { color: #fff; background: var(--gel); }
.steps li.done { color: var(--text); background: linear-gradient(180deg, #2A7D5A, #1A5A3E); }
.search-row { display: flex; gap: 4px; margin-bottom: 6px; }
.pres { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px; margin-bottom: 8px; }
.pcard { display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; padding: 5px 8px; cursor: pointer; color: var(--paper-ink); background: var(--paper); border: 1px solid #8A72D0; font-size: 12px; }
.pcard:hover, .pcard:focus-visible { background: linear-gradient(90deg, #FFD6EC, #EADDFF); }
.pcard small { font-size: 11px; color: #5A4A7A; }
.pcard .muted { color: #8A7AAA; }
.pcard.more { background: var(--metal); color: var(--text); border-color: #120A30; }
.pcard.more small { color: var(--dim); }
.pcard.more svg { width: 13px; height: 13px; color: var(--pink); }
.mapbox { position: relative; height: 260px; background: #FFF4F8; overflow: hidden; border: 1px solid; border-color: var(--sunken); }
.mp-canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.mp-zoom { position: absolute; right: 6px; top: 6px; display: flex; flex-direction: column; gap: 2px; }
.mp-zoom button { width: 26px; height: 26px; color: #2A0B3A; font-size: 15px; font-weight: 700; cursor: pointer; background: linear-gradient(180deg, #F3E8FF, #C9B6F2); border: 1px solid; border-color: #fff #3A2A6A #3A2A6A #fff; }
.mp-note { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 3px 8px; font-size: 10px; background: #FFFFE1; color: #000; border-top: 1px solid #000; }
.psel { margin-top: 8px; }
.selcard { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px; font-size: 12px; background: var(--glass-2); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.tzline { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--amber); }
.tzline svg { width: 13px; height: 13px; }
.review { padding: 8px 10px; margin-bottom: 8px; background: var(--paper); color: var(--paper-ink); border: 1px solid; border-color: var(--sunken); border-left: 4px solid var(--pink); }
.review .muted { color: #6A5A9A; }
.rv-line { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
.rv-tz { margin: 0; font-size: 12px; }
.choice { display: flex; flex-direction: column; gap: 0; margin: -2px 0 8px 2px; }

/* ---------- dialogs = Win2000 windows ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(4, 2, 16, .55); display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-height: 92vh; max-height: 92dvh; display: flex; flex-direction: column; color: var(--text); padding-bottom: var(--safe-b); background: #1A1240; border: 1px solid; border-color: #C9B6FF #0A0620 #0A0620 #C9B6FF; box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .2), 6px 6px 0 rgba(0, 0, 0, .55); animation: pop .12s ease-out; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal .mh { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 3px 3px 3px 8px; margin: 2px 2px 0; background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 55%), var(--title); }
.modal .mh h2 { margin: 0; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal .mh .icon-btn { width: 20px; height: 18px; color: #2A0B3A; background: linear-gradient(180deg, #F3E8FF, #C9B6F2); border: 1px solid; border-color: #fff #3A2A6A #3A2A6A #fff; }
.modal .mh .icon-btn svg { width: 11px; height: 11px; stroke-width: 3; }
.modal .mb { padding: 10px; overflow-y: auto; font-size: 12px; }
.modal .mf { display: flex; justify-content: flex-end; gap: 6px; padding: 6px 10px 8px; flex-wrap: wrap; border-top: 1px solid rgba(0, 0, 0, .4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
.modal .mf .left { margin-right: auto; }
.modal .mf .btn { min-width: 76px; }
@media (min-width: 700px) { .scrim { align-items: center; padding: 20px; } .modal { max-width: 480px; } .modal.wide { max-width: 820px; } }
.more-sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.more-sheet a { display: flex; align-items: center; gap: 8px; padding: 10px; text-decoration: none; font-weight: 700; font-size: 12px; color: var(--text); background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); min-height: 44px; }
.more-sheet svg { width: 18px; height: 18px; color: var(--pink); }
.toasts { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 12px + var(--safe-b)); display: flex; flex-direction: column; gap: 4px; width: min(92vw, 360px); pointer-events: none; }
@media (min-width: 900px) { .toasts { bottom: 16px; left: auto; right: 16px; transform: none; } }
.toast { padding: 6px 10px; background: #FFFFE1; color: #000; font-size: 12px; pointer-events: auto; border: 1px solid #000; box-shadow: 2px 2px 0 rgba(0, 0, 0, .45); animation: pop .12s ease-out; }
.toast.err { background: #FFE1E6; }
.progress { height: 14px; padding: 1px; margin-top: 8px; background: var(--paper); border: 1px solid; border-color: var(--sunken); }
.progress i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #FF3EA5 0 8px, transparent 8px 10px); transition: width .2s; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 4px; margin-bottom: 10px; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 2px solid #fff; }
.pv-frame { width: 100%; height: 56vh; background: #fff; border: 1px solid #000; }
.pv-img { max-height: 56vh; margin: 0 auto; border: 3px solid #fff; }
.pv-text { max-height: 46vh; overflow: auto; padding: 8px; white-space: pre-wrap; font-size: 12px; background: var(--paper); color: var(--paper-ink); border: 1px solid; border-color: var(--sunken); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0; font-size: 12px; }
.dl dt { color: var(--dim); font-weight: 700; } .dl dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- gate (setup / sign-in / loading) ---------- */
.gate { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 16px; }
.gate .palm, .gate .skyline { display: none; }
.gate .card { position: relative; z-index: 2; margin: 0 auto; width: min(94vw, 380px); padding: 0 14px 14px; background: #1A1240; border: 1px solid; border-color: #C9B6FF #0A0620 #0A0620 #C9B6FF; box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .2), 8px 8px 0 rgba(0, 0, 0, .55); }
.gate .card::before { content: 'Welcome'; display: block; margin: 2px -12px 12px; padding: 3px 8px; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 55%), var(--title); text-shadow: 1px 1px 0 rgba(0, 0, 0, .5); }
.gate .wordmark { font-size: 50px; display: block; margin-bottom: 6px; text-align: center; }
.gate p { color: var(--dim); margin: 0 0 12px; font-size: 12px; }
.loading { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; }
.loading .wordmark { font-size: 58px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.msg.grouped .meta { margin: 0; height: 0; justify-content: flex-end; position: relative; top: 2px; overflow: visible; }
.sky .wordmark { white-space: nowrap; flex: none; font-size: 26px; }
.sky .title-wrap { flex: 1; }

/* ---------- Kundli readings, forecasts, compatibility ---------- */
.ksub, .fcseg { margin: -4px 0 10px; display: flex; flex-wrap: wrap; }
.panel h4 { margin: 12px 0 4px; font-size: 12px; color: var(--amber); }
.rd { margin: 0 0 3px; background: var(--well); border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.rd > summary { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 5px 8px; cursor: pointer; list-style: none; background: var(--metal); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.rd > summary::-webkit-details-marker { display: none; }
.rd > summary::before { content: '+'; width: 12px; height: 12px; flex: none; display: inline-grid; place-items: center; font: 700 10px/1 var(--font); color: var(--paper-ink); background: var(--paper); border: 1px solid #1A0F3A; align-self: center; }
.rd[open] > summary::before { content: '–'; }
.rd[open] > summary { background: var(--title); }
.rd-t { font-weight: 700; color: #fff; display: inline-flex; align-items: center; gap: 6px; }
.rd-s { font-size: 11px; color: var(--dim); margin-left: auto; }
.rd[open] .rd-s { color: #FFE3F2; }
.rd-b { padding: 4px 10px 8px; line-height: 1.6; max-width: 76ch; }
.rd-b p { margin: 6px 0; }
.ab { display: inline-block; min-width: 22px; padding: 0 3px; text-align: center; font-size: 10px; font-weight: 700; color: var(--paper-ink); background: var(--amber); border: 1px solid #1A0F3A; }
.two-col { display: grid; grid-template-columns: 1fr; gap: 6px 18px; }
@media (min-width: 760px) { .two-col { grid-template-columns: 1fr 1fr; } .rd-b:has(.two-col) { max-width: none; } }
.two-col h4 { margin-top: 6px; }
.meter { display: block; height: 10px; flex: 1; min-width: 80px; position: relative; background: var(--well); border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.meter i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7B3CFF, #FF3EA5 60%, #FFB547); }
.meter.big { height: 16px; }
.meter em { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #fff; opacity: .7; }
.fc-head { display: flex; align-items: center; gap: 12px; margin: 2px 0 8px; }
.fc-score { display: flex; flex-direction: column; align-items: center; min-width: 74px; padding: 4px 8px; background: var(--paper); color: var(--paper-ink); border: 1px solid; border-color: var(--sunken); }
.fc-score b { font-size: 24px; line-height: 1; color: #B0105E; }
.fc-score span { font-size: 10px; font-weight: 700; color: #4A1A8A; white-space: nowrap; }
.tlist { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 3px; }
.tlist li { padding: 5px 8px 5px 10px; background: var(--well); border-left: 3px solid var(--line-strong); line-height: 1.45; }
.tlist li.ok { border-left-color: #7CF0B0; }
.tlist li.no { border-left-color: #FF6E8C; }
.tlist small { color: var(--dim); font-size: 11.5px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin: 4px 0 10px; }
.dcell { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; text-align: center; background: var(--well); border: 1px solid var(--line); }
.dcell small { font-size: 9.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.dcell.best { border-color: #7CF0B0; box-shadow: inset 0 0 0 1px #7CF0B0; }
.dcell.ch { border-color: #FF6E8C; }
.dn { font-weight: 700; font-size: 11px; }
.vbar { display: block; width: 14px; height: 64px; margin: 3px 0; position: relative; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); }
.vbar i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #7B3CFF, #FF3EA5 70%, #FFB547); }
.dcell.ch .vbar i { background: #FF6E8C; }
.mbars { display: flex; align-items: flex-end; gap: 2px; height: 90px; padding: 4px; background: rgba(0, 0, 0, .3); border: 1px solid; border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
.mbars span { flex: 1; background: linear-gradient(0deg, #7B3CFF, #FF3EA5 70%, #FFB547); min-width: 2px; }
.mbars span.ch { background: #FF6E8C; opacity: .85; }
.mbars-x { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin: 2px 0 6px; }
.ybars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; margin: 4px 0 8px; }
.ybars > div { display: flex; flex-direction: column; align-items: center; }
.ybars .vbar { width: 100%; max-width: 22px; height: 80px; }
.ybars small { font-size: 9.5px; color: var(--dim); }
.roles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; font-size: 11px; }
.gm-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.gm-score { display: flex; flex-direction: column; align-items: center; padding: 6px 14px; background: var(--paper); color: var(--paper-ink); border: 1px solid; border-color: var(--sunken); }
.gm-score b { font: 400 44px/1 var(--script); color: #D4136F; padding: 0 6px; }
.gm-score span { font-size: 10px; font-weight: 700; color: #4A1A8A; }
.gm-meter { flex: 1 1 220px; }
.gm-band { font-weight: 700; color: var(--amber); margin-top: 5px; }
.kootas { display: grid; gap: 3px; margin: 8px 0; }
.koota { background: var(--well); border: 1px solid var(--line); }
.koota > summary { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 8px; padding: 5px 8px; cursor: pointer; list-style: none; }
.koota > summary::-webkit-details-marker { display: none; }
.koota[open] > summary { background: rgba(255, 62, 165, .16); }
.koota p { margin: 4px 10px 8px; line-height: 1.55; }
.kn { font-weight: 700; }
.kp { text-align: right; font-weight: 700; color: var(--amber); }
.kbar { height: 10px; position: relative; background: rgba(0, 0, 0, .35); border: 1px solid var(--line); }
.kbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7B3CFF, #FF3EA5); }
.kgrid2.two { margin: 8px 0; }
@media (min-width: 700px) { .kgrid2.two { grid-template-columns: 1fr 1fr; } }
.kgrid2.two h4 { margin-top: 0; }
.swc { display: inline-block; width: 10px; height: 10px; margin-right: 4px; vertical-align: -1px; border: 1px solid #fff; }
.swc.a { background: #FF3EA5; } .swc.b { background: #63E6FF; }
.wheel .wz { fill: rgba(43, 27, 143, .55); stroke: #FF3EA5; stroke-width: 1; }
.wheel .wz.alt { fill: rgba(123, 60, 255, .35); }
.wheel .wl { font: 700 9px var(--font); fill: #FFE3F2; }
.wheel .wsp { stroke: rgba(185, 171, 223, .28); stroke-width: .8; }
.wheel .wr { fill: none; stroke: #FF3EA5; stroke-width: 1; }
.wheel .wr.dim { stroke: rgba(185, 171, 223, .35); stroke-dasharray: 2 3; }
.wheel .wtick { stroke-width: 1; } .wheel .wtick.a { stroke: #FF3EA5; } .wheel .wtick.b { stroke: #63E6FF; }
.wheel .wp { stroke: #0B0720; stroke-width: 1; } .wheel .wp.a { fill: #FF3EA5; } .wheel .wp.b { fill: #63E6FF; }
.wheel .wt { font: 700 9px var(--font); fill: #0B0720; }
.wheel .wc { stroke-width: 1.6; opacity: .9; } .wheel .wc.soft { stroke: #FFB547; } .wheel .wc.hard { stroke: #FF3EA5; stroke-dasharray: 4 2; }
.wheel .wcen { font: 700 10px var(--font); fill: #FF8CC6; } .wheel .wcen.b { fill: #63E6FF; }
.scene.swap .scene-svg { animation: sceneIn .5s ease-out; }
@keyframes sceneIn { from { opacity: .25; } to { opacity: 1; } }
.scene::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(11, 7, 32, .42) 0%, rgba(11, 7, 32, 0) 34%, rgba(11, 7, 32, 0) 70%, rgba(11, 7, 32, .35) 100%); }
.rd-g { flex-basis: 100%; font-size: 11.5px; line-height: 1.45; color: #E7DDFF; font-weight: 400; padding-left: 20px; }
.rd[open] .rd-g { color: #FFF; }
.glance { width: 100%; border-collapse: collapse; font-size: 12px; }
.glance th { text-align: left; vertical-align: top; width: 34%; padding: 5px 8px 5px 0; color: var(--amber); font-weight: 700; border-bottom: 1px solid var(--line); }
.glance.two th { width: 22%; }
.glance thead th { color: #fff; }
.glance td { padding: 5px 0 5px 4px; vertical-align: top; border-bottom: 1px solid var(--line); }
.glance td b { display: block; }
.glance td span { display: block; color: var(--dim); font-size: 11.5px; line-height: 1.4; }
.advice { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 4px; }
.advice > div { padding: 6px 8px; background: var(--well); border-left: 3px solid #7CF0B0; }
.advice > .no { border-left-color: #FF6E8C; }
.advice ul { margin: 3px 0 0; padding-left: 16px; font-size: 12px; line-height: 1.45; }
.pair-days { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 8px; }
.pair-days > div { padding: 6px 8px; background: var(--well); border: 1px solid var(--line); font-size: 12px; }
.pair-days small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
.rd-b h5 { margin: 12px 0 2px; font-size: 12px; color: var(--amber); }
.rd-b h5:first-child { margin-top: 6px; }
.rd-b ul.facts, .koota ul.facts { margin: 4px 0 6px; padding-left: 18px; line-height: 1.55; }
.rd-b ul.facts li, .koota ul.facts li { margin: 2px 0; }

/* ---------- PIN lock ---------- */
.demo-bar .db-lock { margin-left: 6px; padding: 2px 8px; font: 700 11px var(--font); color: #fff; background: rgba(255, 255, 255, .08); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); cursor: pointer; }
.pinlock { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: rgba(11, 7, 32, .92); }
.pinlock-box { width: min(92vw, 360px); padding: 22px 18px; text-align: center; background: var(--glass, #1A1036); border: 1px solid; border-color: var(--hi) var(--lo) var(--lo) var(--hi); }
.pinlock-box .wordmark { font-size: 40px; }
.pinlock-who { display: grid; gap: 8px; margin-top: 12px; }
.ro-fs { border: 0; margin: 0; padding: 0; min-width: 0; }
/* ---------- Western charts (v2) ---------- */
.gl { font-family: 'Vice Glyphs', var(--font); font-weight: 400; display: inline-block; min-width: 1.1em; text-align: center; color: var(--amber); }
.rd-t .gl { margin-right: 2px; }
.wheelwrap { max-width: 520px; margin: 0 auto; }
.wheel-svg { width: 100%; height: auto; display: block; }
.wheel-svg .wb:hover text { filter: brightness(1.3); }
.lc { font-weight: 700; } .lc.soft { color: #63E6FF; } .lc.hard { color: #FF3EA5; } .lc.adj { color: #FFB547; }
.agrid { border-collapse: collapse; font-family: 'Vice Glyphs', var(--font); font-size: 12px; margin: 0 auto; }
.agrid th, .agrid td { width: 24px; height: 24px; min-width: 24px; text-align: center; padding: 0; border: 1px solid var(--line); line-height: 1; }
.agrid th { color: var(--amber); font-weight: 400; background: rgba(0, 0, 0, .25); }
.agrid th.ca { color: #FF8CC6; } .agrid th.cb { color: #63E6FF; }
.agrid td { background: rgba(0, 0, 0, .18); }
.agrid td small { display: block; font: 8px var(--font); color: var(--dim); }
.agrid td.k-soft { color: #63E6FF; } .agrid td.k-hard { color: #FF3EA5; } .agrid td.k-adjust { color: #FFB547; } .agrid td.k-conj { color: #FFE3F2; }
.panel:has(.agrid) { overflow-x: auto; }
.bal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; margin: 4px 0 8px; }
.bal > div { display: grid; grid-template-columns: 64px 1fr 34px; align-items: center; gap: 6px; font-size: 11.5px; }
.bal small { text-align: right; color: var(--dim); }
.cat { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
.cat b { text-align: right; color: var(--amber); }
.gm-score b { font-family: var(--script); }
.glance td span.gl, .glance th span.gl { display: inline-block; color: var(--amber); font-size: inherit; margin-right: 3px; }
.glance td b .gl { color: var(--amber); }
.astro-sw { display: flex; margin: 0 0 8px; }
.astro-sw button { flex: 1; }

p.life{border-left:3px solid var(--accent,#ff2d95);padding:4px 0 4px 10px;margin:8px 0}

/* ============================================================
   Storage layer
   - cloud: claude.ai artifact capabilities (db, user, assets, downloads)
   - local: same API surface, backed by localStorage + IndexedDB
     (used for demo / testing outside claude.ai and for the PWA build)
   ============================================================ */

const Store = (() => {
  const SEG_OK = /^[A-Za-z0-9_\-.~:@+]+$/;

  /* ---------------- local document store ---------------- */
  function makeLocalDb() {
    const KEY = 'oss.db.v1';
    let data = {};
    try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch { data = {}; }
    const listeners = new Set();
    const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { console.warn('local save failed', e); } };
    const err = (code, message) => Object.assign(new Error(message), { code, message });
    const clone = (o) => JSON.parse(JSON.stringify(o));
    const segs = (p) => p.split('/');
    const check = (p, even) => {
      const s = segs(p);
      if (s.some((x) => !SEG_OK.test(x) || x === '.' || x === '..')) throw new TypeError('bad path ' + p);
      if ((s.length % 2 === 0) !== even) throw new TypeError('path parity ' + p);
    };
    const deepMerge = (a, b) => {
      const out = { ...a };
      for (const [k, v] of Object.entries(b)) {
        if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) out[k] = deepMerge(a[k], v);
        else out[k] = v;
      }
      return out;
    };
    const snapOf = (path) => {
      const body = data[path];
      const id = path.split('/').pop();
      const frozen = body ? Object.freeze(clone(body)) : undefined;
      return { id, exists: !!body, data: () => frozen, metadata: { fromCache: false, hasPendingWrites: false } };
    };
    const cmp = (a, b) => (a === b ? 0 : a === undefined ? 1 : b === undefined ? -1 : a < b ? -1 : 1);
    const runQuery = (q) => {
      const depth = segs(q.path).length + 1;
      let rows = Object.keys(data)
        .filter((p) => p.startsWith(q.path + '/') && segs(p).length === depth)
        .map((p) => ({ p, d: data[p] }));
      for (const [f, op, v] of q.filters) {
        rows = rows.filter(({ d }) => {
          const x = d[f];
          switch (op) {
            case '==': return x === v;
            case '!=': return x !== v;
            case '<': return x < v;
            case '<=': return x <= v;
            case '>': return x > v;
            case '>=': return x >= v;
            case 'in': return v.includes(x);
            case 'not-in': return !v.includes(x);
            case 'array-contains': return Array.isArray(x) && x.includes(v);
            default: return true;
          }
        });
      }
      if (q.order) {
        const [f, dir] = q.order;
        rows.sort((a, b) => cmp(a.d[f], b.d[f]) * (dir === 'desc' ? -1 : 1));
      } else rows.sort((a, b) => cmp(a.p, b.p));
      if (q.lim) rows = rows.slice(0, q.lim);
      const docs = rows.map(({ p }) => snapOf(p));
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
    };
    const notify = () => {
      for (const l of [...listeners]) setTimeout(() => { if (listeners.has(l)) l.fire(); }, 0);
    };
    window.addEventListener('storage', (e) => {
      if (e.key !== KEY) return;
      try { data = JSON.parse(e.newValue || '{}') || {}; } catch { data = {}; }
      notify();
    });
    const delay = () => new Promise((r) => setTimeout(r, 60 + Math.random() * 120));

    function docRef(path) {
      check(path, true);
      return {
        id: path.split('/').pop(), path,
        async get() { await delay(); return snapOf(path); },
        async set(body) { data[path] = clone(body); persist(); notify(); await delay(); },
        async update(body) {
          if (!data[path]) { await delay(); throw err('invalid_argument', 'document does not exist'); }
          data[path] = deepMerge(data[path], clone(body)); persist(); notify(); await delay();
        },
        async delete() { delete data[path]; persist(); notify(); await delay(); },
        async acquire() { return { acquired: true, version: 1 }; },
        onSnapshot(next) {
          const l = { fire: () => next(snapOf(path)) };
          listeners.add(l); l.fire();
          return () => listeners.delete(l);
        },
        collection(sub) { return collRef(path + '/' + sub); },
      };
    }
    function query(path, q) {
      return {
        where(f, op, v) { return query(path, { ...q, filters: [...q.filters, [f, op, v]] }); },
        orderBy(f, dir = 'asc') { return query(path, { ...q, order: [f, dir] }); },
        limit(n) { return query(path, { ...q, lim: n }); },
        async get() { await delay(); return runQuery({ path, ...q }); },
        onSnapshot(next) {
          const l = { fire: () => next(runQuery({ path, ...q })) };
          listeners.add(l); setTimeout(() => listeners.has(l) && l.fire(), 30);
          return () => listeners.delete(l);
        },
      };
    }
    function collRef(path) {
      check(path, false);
      return Object.assign(query(path, { filters: [], order: null, lim: 0 }), {
        path,
        doc(id) { return docRef(path + '/' + (id || uid())); },
        async add(body) { const r = docRef(path + '/' + uid()); await r.set(body); return r; },
      });
    }
    return {
      doc: docRef, collection: collRef,
      _wipe() { data = {}; persist(); notify(); },
    };
  }

  /* ---------------- local asset store (IndexedDB) ---------------- */
  function makeLocalAssets() {
    const cache = new Map();
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('oss-assets', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('blobs');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('blobs', mode);
        const req = fn(t.objectStore('blobs'));
        t.oncomplete = () => res(req && req.result);
        t.onerror = () => rej(t.error);
      });
    };
    return {
      async upload(blob, opts = {}) {
        if (blob.size > 20 * 1024 * 1024) throw { code: 'too_large', message: 'Over 20 MB' };
        const id = 'L' + uid() + uid();
        const type = opts.type || blob.type || 'application/octet-stream';
        const b = new Blob([blob], { type });
        await tx('readwrite', (s) => s.put({ blob: b, at: Date.now() }, id));
        const url = URL.createObjectURL(b);
        cache.set(id, url);
        return { id, url, sizeBytes: b.size, contentType: type };
      },
      async list() {
        const all = await tx('readonly', (s) => s.getAll());
        const bytes = (all || []).reduce((n, r) => n + (r.blob ? r.blob.size : 0), 0);
        return { assets: [], usage: { files: (all || []).length, bytes, maxFiles: 5000, maxBytes: 500 * 1024 * 1024 } };
      },
      async delete(id) {
        await tx('readwrite', (s) => s.delete(id));
        cache.delete(id);
        return { deleted: true };
      },
      async resolve(id) {
        if (cache.has(id)) return cache.get(id);
        const rec = await tx('readonly', (s) => s.get(id));
        if (!rec) return null;
        const url = URL.createObjectURL(rec.blob);
        cache.set(id, url);
        return url;
      },
    };
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  const withTimeout = (p, ms, fallback = null) =>
    Promise.race([p, new Promise((r) => setTimeout(() => r(fallback), ms))]);

  async function waitForClaude(ms) {
    const t0 = Date.now();
    while (Date.now() - t0 < ms) {
      if (window.claude && typeof window.claude.use === 'function') return true;
      await new Promise((r) => setTimeout(r, 50));
    }
    return false;
  }

  /* ---------------- init ---------------- */
  async function init() {
    if (window.ENKO_FIREBASE && typeof FirebaseStore !== 'undefined') { const r = await FirebaseStore.init(); if (r) return r; }
    const inClaude = window.OSS_STANDALONE ? false : await waitForClaude(/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:' ? 600 : 5000);
    if (inClaude) {
      const use = (n) => withTimeout(window.claude.use(n).catch(() => null), 10000);
      const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
      if (!db || !user) return { mode: 'cloud', ok: false };
      const id = await user.id();
      if (!id) return { mode: 'cloud', ok: false };
      return {
        mode: 'cloud', ok: true, db, user, assets, downloads, myId: id,
        assetUrl: (aid) => (aid ? '/_blob/' + aid : ''),
        resolveAsset: async (aid) => (aid ? '/_blob/' + aid : null),
        async names(ids) {
          try { const ps = await user.profiles(ids.filter(Boolean)); const out = {}; for (const i of ids) out[i] = (ps && ps[i] && ps[i].name) || ''; return out; } catch { return {}; }
        },
      };
    }
    // local / demo
    const db = makeLocalDb();
    const assets = makeLocalAssets();
    let who = 'A';
    try { who = localStorage.getItem('oss.demoPerson') || 'A'; } catch {}
    return {
      mode: 'local', ok: true, db, assets, downloads: null, myId: 'demo-' + who,
      assetUrl: () => '',
      resolveAsset: (aid) => assets.resolve(aid),
      async names() { return {}; },
      switchPerson(seat) { try { localStorage.setItem('oss.demoPerson', seat); } catch {} location.reload(); },
      wipe() { db._wipe(); },
    };
  }

  return { init, uid, withTimeout };
})();

/* ============================================================
   Firebase backend for the Android / self-hosted app.
   Exposes the same interface as the claude.ai capabilities
   (db / assets / user), so every screen works unchanged.
   Needs: window.firebase (compat SDK) + window.ENKO_FIREBASE config.
   ============================================================ */
const FirebaseStore = (() => {
  const mapErr = (e) => {
    const c = (e && e.code) || '';
    const code = /permission-denied|not-found|invalid-argument|failed-precondition/.test(c) ? 'invalid_argument'
      : /resource-exhausted/.test(c) ? 'resource_exhausted'
        : /unauthenticated/.test(c) ? 'revoked'
          : /storage\/unauthorized/.test(c) ? 'invalid_argument'
            : /storage\/quota-exceeded/.test(c) ? 'quota_or_state'
              : 'unavailable';
    return Object.assign(new Error((e && e.message) || code), { code, cause: e });
  };
  const wrapDoc = (s) => ({ id: s.id, exists: s.exists, data: () => (s.exists ? s.data() : undefined), metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } });
  const wrapQuery = (s) => ({ docs: s.docs.map(wrapDoc), size: s.size, empty: s.empty, docChanges: () => s.docChanges().map((c) => ({ type: c.type, doc: wrapDoc(c.doc), oldIndex: c.oldIndex, newIndex: c.newIndex })), metadata: { fromCache: s.metadata.fromCache, hasPendingWrites: s.metadata.hasPendingWrites } });
  const isPlain = (v) => v && typeof v === 'object' && !Array.isArray(v) && Object.getPrototypeOf(v) === Object.prototype;
  // {a:{b:1,c:{d:2}}} → [[['a','b'],1],[['a','c','d'],2]]  (deep-merge semantics, like the claude.ai store)
  function flatten(obj, pre = [], out = []) {
    for (const [k, v] of Object.entries(obj)) {
      if (isPlain(v) && Object.keys(v).length) flatten(v, [...pre, k], out);
      else out.push([[...pre, k], v === undefined ? null : v]);
    }
    return out;
  }
  const clean = (v) => JSON.parse(JSON.stringify(v)); // drop undefined, freeze-safe

  function makeDb(fs) {
    function docRef(path) {
      const r = fs.doc(path);
      return {
        id: r.id, path,
        async get() { try { return wrapDoc(await r.get()); } catch (e) { throw mapErr(e); } },
        async set(body) { try { await r.set(clean(body)); } catch (e) { throw mapErr(e); } },
        async update(body) {
          const pairs = flatten(clean(body));
          if (!pairs.length) return;
          const args = [];
          for (const [p, v] of pairs) args.push(new firebase.firestore.FieldPath(...p), v);
          try { await r.update(...args); } catch (e) { throw mapErr(e); }
        },
        async delete() { try { await r.delete(); } catch (e) { throw mapErr(e); } },
        async acquire() { return { acquired: true }; },
        onSnapshot(next, err) { return r.onSnapshot((s) => next(wrapDoc(s)), (e) => err && err(mapErr(e))); },
        collection(sub) { return collRef(path + '/' + sub); },
      };
    }
    function q(base, path) {
      return {
        where: (f, op, v) => q(base.where(f, op, v), path),
        orderBy: (f, d = 'asc') => q(base.orderBy(f, d), path),
        limit: (n) => q(base.limit(n), path),
        async get() { try { return wrapQuery(await base.get()); } catch (e) { throw mapErr(e); } },
        onSnapshot(next, err) { return base.onSnapshot((s) => next(wrapQuery(s)), (e) => err && err(mapErr(e))); },
      };
    }
    function collRef(path) {
      const c = fs.collection(path);
      return Object.assign(q(c, path), {
        path,
        doc: (id) => docRef(path + '/' + (id || Store.uid())),
        async add(body) { const d = docRef(path + '/' + Store.uid()); await d.set(body); return d; },
      });
    }
    return { doc: docRef, collection: collRef };
  }

  function makeAssets(st) {
    const cache = new Map();
    return {
      async upload(blob, opts = {}) {
        if (blob.size > 20 * 1024 * 1024) throw { code: 'too_large' };
        const id = 'enko/' + Store.uid() + Store.uid();
        const type = opts.type || blob.type || 'application/octet-stream';
        try {
          const ref = st.ref(id);
          await ref.put(blob, { contentType: type, cacheControl: 'private, max-age=31536000' });
          const url = await ref.getDownloadURL();
          cache.set(id, url);
          return { id, url, sizeBytes: blob.size, contentType: type };
        } catch (e) { throw mapErr(e); }
      },
      async list() { throw { code: 'capability_removed' }; },
      async delete(id) { try { await st.ref(id).delete(); cache.delete(id); return { deleted: true }; } catch (e) { if (/object-not-found/.test(e.code)) return { deleted: false }; throw mapErr(e); } },
      async resolve(id) {
        if (cache.has(id)) return cache.get(id);
        try { const u = await st.ref(id).getDownloadURL(); cache.set(id, u); return u; } catch { return null; }
      },
    };
  }

  async function init() {
    const cfg = window.ENKO_FIREBASE;
    if (!cfg || !window.firebase) return null;
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    const auth = firebase.auth();
    const fs = firebase.firestore();
    try { await fs.enablePersistence({ synchronizeTabs: false }); } catch {}
    const user = await new Promise((res) => { const un = auth.onAuthStateChanged((u) => { un(); res(u); }); });
    void app;
    if (!user) return { mode: 'firebase', ok: false, needAuth: true, auth };
    const db = makeDb(fs);
    const assets = makeAssets(firebase.storage());
    return {
      mode: 'firebase', ok: true, db, assets, downloads: null, myId: user.uid, email: user.email, auth,
      assetUrl: () => '',
      resolveAsset: (aid) => assets.resolve(aid),
      async names() { return {}; },
      signOut: () => auth.signOut().then(() => location.reload()),
      // Play policy: in-app account deletion. Removes private data and the seat, then the login.
      async deleteAccount(password) {
        const u = auth.currentUser;
        if (password) await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, password));
        const mine = await fs.collection('data/users/' + u.uid).get();
        for (const d of mine.docs) await d.ref.delete();
        await fs.runTransaction(async (tx) => {
          const ref = fs.doc('space/members'); const snap = await tx.get(ref);
          if (!snap.exists) return;
          const dta = snap.data(); const seat = ['A', 'B'].find((k) => dta.seats && dta.seats[k] && dta.seats[k].id === u.uid);
          if (!seat) return;
          tx.update(ref, new firebase.firestore.FieldPath('seats', seat), firebase.firestore.FieldValue.delete(), 'ids', (dta.ids || []).filter((x) => x !== u.uid));
        });
        await u.delete();
      },
      // Seats are claimed in a transaction so two people can't take the same one
      async claimSeat(nick) {
        const ref = fs.doc('space/members');
        return fs.runTransaction(async (tx) => {
          const snap = await tx.get(ref);
          const data = snap.exists ? snap.data() : { seats: {}, ids: [] };
          const seats = data.seats || {}, ids = data.ids || [];
          const have = ['A', 'B'].find((k) => seats[k] && seats[k].id === user.uid);
          if (have) return have;
          const seat = !seats.A ? 'A' : !seats.B ? 'B' : null;
          if (!seat) return null;
          const entry = { id: user.uid, nick, joinedAt: Date.now() };
          if (snap.exists) tx.update(ref, new firebase.firestore.FieldPath('seats', seat), entry, 'ids', [...ids, user.uid]);
          else tx.set(ref, { seats: { [seat]: entry }, ids: [user.uid] });
          return seat;
        }).catch((e) => { throw mapErr(e); });
      },
    };
  }

  /* ---------- sign-in screen ---------- */
  function authGate(auth, done) {
    let mode = 'in';
    const draw = (msg = '') => {
      gate(`<span class="wordmark">Vice Space</span>
        <p>${mode === 'in' ? 'Sign in to your shared space.' : mode === 'up' ? 'Create your account. You’ll pick the name your partner sees next.' : 'Enter your email and we’ll send a link to reset your password.'}</p>
        <form id="af" novalidate>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
          ${mode !== 'reset' ? `<label class="field"><span>Password</span><input name="pw" type="password" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}" minlength="8" required></label>` : ''}
          <p class="hint" id="aerr" role="alert" style="color:#8E1B2E;min-height:1em">${esc(msg)}</p>
          <button class="btn" type="submit" style="width:100%">${mode === 'in' ? 'Sign in' : mode === 'up' ? 'Create account' : 'Send reset link'}</button>
        </form>
        <p style="margin:16px 0 0;display:flex;gap:14px;flex-wrap:wrap">
          ${mode !== 'in' ? '<button class="linkish" data-m="in">I have an account</button>' : '<button class="linkish" data-m="up">Create an account</button><button class="linkish" data-m="reset">Forgot password?</button>'}
        </p>`);
      $$('[data-m]').forEach((b) => (b.onclick = () => { mode = b.dataset.m; draw(); }));
      $('#af').onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target, email = f.email.value.trim(), pw = f.pw ? f.pw.value : '';
        if (!/^\S+@\S+\.\S+$/.test(email)) return draw('Enter a valid email address.');
        if (mode !== 'reset' && pw.length < 8) return draw('Use at least 8 characters for the password.');
        const btn = $('button[type=submit]', f); btn.disabled = true;
        try {
          if (mode === 'in') await auth.signInWithEmailAndPassword(email, pw);
          else if (mode === 'up') await auth.createUserWithEmailAndPassword(email, pw);
          else { await auth.sendPasswordResetEmail(email); mode = 'in'; return draw('Reset link sent. Check your email, then sign in.'); }
          done();
        } catch (er) {
          const c = (er && er.code) || '';
          draw(/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c) ? 'That email and password don’t match.'
            : /email-already-in-use/.test(c) ? 'There’s already an account with this email. Sign in instead.'
              : /too-many-requests/.test(c) ? 'Too many attempts. Wait a few minutes and try again.'
                : /network/.test(c) ? 'No connection. Check your internet and try again.' : 'Something went wrong. Try again.');
        }
      };
      setTimeout(() => { const i = $('#af input'); i && i.focus(); }, 30);
    };
    draw();
  }
  return { init, authGate, flatten };
})();
if (typeof module !== 'undefined') module.exports = FirebaseStore;

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const uid = () => Store.uid();
const pad = (n) => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtDate = (d, opts = { day: 'numeric', month: 'short', year: 'numeric' }) => (d instanceof Date ? d : parseISO(d)).toLocaleDateString(undefined, opts);
const fmtStamp = (ts) => new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtSize = (b) => (b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const dayLabel = (ts) => {
  const d = new Date(ts), t = new Date();
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const diff = Math.round((b - a) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });
};

/* ---------- asset hydration ---------- */
async function hydrate(root = document) {
  for (const el of $$('[data-asset]', root)) {
    const id = el.getAttribute('data-asset');
    if (!id || el.dataset.hyd === id) continue;
    el.dataset.hyd = id;
    const url = S.st.mode === 'cloud' ? '/_blob/' + id : await S.st.resolveAsset(id);
    if (!url) { el.classList.add('missing'); continue; }

const modalStack = [];
function openModal({ title, body, foot = '', wide = false, onMount, onClose, label }) {
  const prevFocus = document.activeElement;
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label || title)}">
    <div class="mh"><h2>${esc(title)}</h2><button class="icon-btn" data-x aria-label="Close">${icon('close')}</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  document.body.appendChild(scrim);
  const m = scrim.firstElementChild;
  let closed = false;
  const close = (v) => {
    if (closed) return; closed = true;
    scrim.remove(); modalStack.splice(modalStack.indexOf(close), 1);
    onClose && onClose(v);
    prevFocus && prevFocus.focus && prevFocus.focus();
  };
  modalStack.push(close);
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) close(); });
  $('[data-x]', m).onclick = () => close();
  onMount && onMount(m, close);
  setTimeout(() => { const f = $('[autofocus]', m) || $('input,textarea,select,button:not([data-x])', m); f && f.focus(); }, 30);
  return close;
}

/* ---------- download / save a file to the viewer ---------- */
async function saveFile(filename, blobOrText, type = 'application/octet-stream') {
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], { type });
  if (window.EnkoAndroid && window.EnkoAndroid.saveFile) {
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
    const out = window.EnkoAndroid.saveFile(filename, blob.type || type, b64);
    if (out === 'ok') { toast('Saved to Downloads'); return false; }
    toast('Couldn’t save the file: ' + out, 'err'); return false;
  }
  if (S.st.downloads) {
    try { await S.st.downloads.save({ filename, data: blob }); return true; } catch (e) {
      if (e && (e.code === 'cancelled' || e.code === 'declined' || e.code === 'user_cancelled')) return false;
      try { await S.st.downloads.save({ filename, data: await blob.text() }); return true; } catch {}
    }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return true;
  } catch { return false; }
}

/* ---------- error text ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded' || c === 'quota_or_state') return 'Storage is full. Delete some items and try again.';
  if (c === 'too_large') return 'That file is over 20 MB. Choose a smaller file.';
  if (c === 'unsupported_type') return 'That file type can’t be stored. Use PDF, JPG, PNG, WebP, GIF or plain text.';
  if (c === 'rate_limited' || c === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  if (c === 'invalid_argument') return 'You don’t have permission to change this. Ask the space owner for Editor access.';
  if (c === 'revoked' || c === 'not_granted') return 'Your access to this space changed. Reload to continue.';
  return 'Couldn’t reach the server. Check your connection and try again.';
}
async function retryOnce(fn) {
  try { return await fn(); } catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'store_unavailable')) { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
    throw e;
  }
}

/* ---------- image processing ---------- */
async function decodeImage(file) {
  try { return await createImageBitmap(file); } catch {}
  const url = URL.createObjectURL(file);

}

  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((r) => c.toBlob((b) => r(b), type, q));

  if (!okType || file.size > 12 * 1024 * 1024) full = await scaleTo(bmp, 3200, 'image/jpeg', 0.9);
  return { thumb, full, w: bmp.width, h: bmp.height };
}

/* ============================================================
   Personal PINs for the shared-phone mode.
   Each person has their own 4–6 digit PIN. Switching to the
   other person, and opening the app after time away, needs that
   person's PIN, so nobody can write, upload or create a Kundali
   as their partner.
   ============================================================ */
const PIN = (() => {
  const KEY = (seat) => 'oss.pin.' + seat;
  const UNLOCK = 'oss.unlockedAt', AWAY_MS = 5 * 60 * 1000, FRESH_MS = 5 * 60 * 1000;
  const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  async function hash(seat, pin) {
    const data = new TextEncoder().encode('vice-space-pin|' + seat + '|' + pin);
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', data);
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 2166136261; for (const c of data) { h ^= c; h = Math.imul(h, 16777619) >>> 0; } return 'f' + h.toString(16);
  }
  const has = (seat) => !!get(KEY(seat));
  async function set(seat, pin) { put(KEY(seat), await hash(seat, pin)); }
  async function check(seat, pin) { return get(KEY(seat)) === (await hash(seat, pin)); }
  const markUnlocked = () => put(UNLOCK, String(Date.now()));
  const fresh = () => Date.now() - Number(get(UNLOCK) || 0) < FRESH_MS;
  const valid = (p) => /^\d{4,6}$/.test(p);
  let fails = 0, lockedUntil = 0;

  // one dialog for create / enter
  function ask(seat, mode, { closable = true } = {}) {
    const who = nameOf(seat);
    return new Promise((resolve) => {
      openModal({
        title: mode === 'create' ? `Set ${who}’s PIN` : `${who}’s PIN`, label: 'PIN',
        body: `<form id="pinf" autocomplete="off">
          ${mode === 'create' ? `<p style="margin-top:0">Only <b>${esc(who)}</b> should choose this. It stops anyone else from writing, uploading or creating a Kundali as ${esc(who)}.</p>` : `<p style="margin-top:0">Enter <b>${esc(who)}</b>’s PIN to continue as ${esc(who)}.</p>`}
          <label class="field"><span>${mode === 'create' ? 'New PIN (4–6 digits)' : 'PIN'}</span><input id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required></label>
          ${mode === 'create' ? '<label class="field"><span>Repeat the PIN</span><input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required></label>' : ''}
          <p class="hint" id="pinErr" role="alert"></p>
          ${mode === 'enter' ? '<p class="hint">Forgot it? A PIN can only be removed by deleting all data on this phone (Settings → Delete everything).</p>' : ''}
        </form>`,
        foot: `${closable ? '<button class="btn ghost" data-x2>Cancel</button>' : ''}<button class="btn" data-ok>${mode === 'create' ? 'Save PIN' : 'Unlock'}</button>`,
        onMount: (m, close) => {
          const err = (t) => { $('#pinErr', m).textContent = t; };
          const go = async () => {
            const p1 = $('#pin1', m).value.trim();
            if (mode === 'create') {
              const p2 = $('#pin2', m).value.trim();
              if (!valid(p1)) return err('Use 4 to 6 digits.');
              if (p1 !== p2) return err('The two PINs don’t match.');
              await set(seat, p1); close(true); return;
            }
            if (Date.now() < lockedUntil) return err(`Too many attempts. Try again in ${Math.ceil((lockedUntil - Date.now()) / 1000)} s.`);
            if (await check(seat, p1)) { fails = 0; close(true); return; }
            fails++; $('#pin1', m).value = '';
            if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; err('Wrong PIN. Wait 30 seconds before trying again.'); } else err('Wrong PIN.');
          };
          $('[data-ok]', m).onclick = go;
          $('#pinf', m).onsubmit = (e) => { e.preventDefault(); go(); };
          const x = $('[data-x2]', m); if (x) x.onclick = () => close(false);
          setTimeout(() => $('#pin1', m).focus(), 50);
        },
        onClose: (v) => resolve(!!v),
      });
    });
  }
  // switch who is writing — always needs the target's PIN
  async function switchTo(seat) {
    if (seat === S.me.seat) return;
    const okd = has(seat) ? await ask(seat, 'enter') : await ask(seat, 'create');
    if (!okd) return;
    markUnlocked();
    S.st.switchPerson(seat);
  }
  // full-screen lock: pick who you are, enter your PIN
  function lockScreen() {
    if (document.querySelector('.pinlock')) return;
    const el = document.createElement('div');
    el.className = 'pinlock';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Vice Space is locked');
    el.innerHTML = `<div class="pinlock-box"><span class="wordmark">Vice Space</span><p>Who’s using the app?</p>
      <div class="pinlock-who">${['A', 'B'].filter((s) => S.members[s]).map((s) => `<button class="btn${s === S.me.seat ? '' : ' ghost'}" data-who="${s}">${esc(nameOf(s))}</button>`).join('')}</div></div>`;
    document.body.appendChild(el);
    $$('[data-who]', el).forEach((b) => (b.onclick = async () => {
      const seat = b.dataset.who;
      const okd = has(seat) ? await ask(seat, 'enter', { closable: true }) : await ask(seat, 'create', { closable: true });
      if (!okd) return;
      markUnlocked();
      if (seat !== S.me.seat) { S.st.switchPerson(seat); return; }
      el.remove();
    }));
  }
  function guard() {
    if (S.st.mode !== 'local') return;
    if (has(S.me.seat) && !fresh()) lockScreen(); else markUnlocked();
    setInterval(() => { if (!document.hidden && !document.querySelector('.pinlock')) markUnlocked(); }, 30000);
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); markUnlocked(); return; }
      if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && has(S.me.seat)) lockScreen();
    });
  }
  return { has, set, check, ask, switchTo, lockScreen, guard, markUnlocked, valid };
})();
